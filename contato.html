<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contato | VaidTáxi</title>

    <!-- Fonte Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- CSS principal -->
    <link rel="stylesheet" href="css/style.css">

</head>


<body>


<!-- ======================================================
     HEADER
====================================================== -->

<header>

    <div class="container">

        <a href="index.html" class="logo">

            <h1>
                Vaid <span>Táxi</span>
            </h1>

        </a>


        <nav>

            <a href="index.html">
                Início
            </a>

            <a href="motoristas.html">
                Motoristas
            </a>

            <a href="pagamentos.html">
                Pagamentos
            </a>

            <a href="contato.html" class="active">
                Contato
            </a>

        </nav>


        <div class="header-buttons">

        </div>


        <div id="menu-mobile">
            ☰
        </div>

    </div>

</header>



<!-- ======================================================
     BANNER DA PÁGINA
====================================================== -->

<section class="page-banner">

    <div class="container">

        <h1>
            Entre em Contato
        </h1>

        <p>
            Fale com a equipe VaidTáxi.
        </p>

    </div>

</section>



<!-- ======================================================
     CONTATO
====================================================== -->

<section>

    <div class="container">

        <h2 class="section-title">
            Fale <span>Conosco</span>
        </h2>


        <div class="cards">


            <!-- INFORMAÇÕES -->

            <div class="card">

                <i>☎</i>

                <h3>
                    Telefone
                </h3>

                <p>
                    (00) 00000-0000
                </p>

            </div>


            <div class="card">

                <i>✉</i>

                <h3>
                    E-mail
                </h3>

                <p>
                    contato@vaidtaxi.com
                </p>

            </div>


            <div class="card">

                <i>W</i>

                <h3>
                    WhatsApp
                </h3>

                <p>
                    Entre em contato diretamente
                    pelo WhatsApp.
                </p>

            </div>


        </div>

    </div>

</section>



<!-- ======================================================
     FORMULÁRIO
====================================================== -->

<section class="services">

    <div class="container">

        <h2 class="section-title">
            Envie uma <span>Mensagem</span>
        </h2>


        <form class="form-container" id="formContato">


            <div class="form-group">

                <label for="nome">
                    Nome
                </label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    required
                >

            </div>


            <div class="form-group">

                <label for="telefone">
                    Telefone
                </label>

                <input
                    type="tel"
                    id="telefone"
                    name="telefone"
                    placeholder="Digite seu telefone"
                >

            </div>


            <div class="form-group">

                <label for="assunto">
                    Assunto
                </label>

                <input
                    type="text"
                    id="assunto"
                    name="assunto"
                    placeholder="Digite o assunto"
                    required
                >

            </div>


            <div class="form-group">

                <label for="mensagem">
                    Mensagem
                </label>

                <textarea
                    id="mensagem"
                    name="mensagem"
                    placeholder="Digite sua mensagem..."
                    required
                ></textarea>

            </div>


            <button
                type="submit"
                class="btn"
            >
                Enviar Mensagem
            </button>


        </form>

    </div>

</section>



<!-- ======================================================
     FOOTER
====================================================== -->

<footer>

    <div class="container">

        <p>
            © 2026 VaidTáxi. Todos os direitos reservados.
        </p>

    </div>

</footer>


</body>

</html>
