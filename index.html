<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TriageAI</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#eef5ff;
color:#333;
}

header{
background:#0d6efd;
color:white;
padding:20px;
text-align:center;
box-shadow:0 2px 10px rgba(0,0,0,.2);
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.card{
background:white;
padding:25px;
border-radius:16px;
box-shadow:0 0 10px rgba(0,0,0,.1);
margin-bottom:20px;
}

.hidden{display:none;}

label{
display:block;
margin-top:15px;
font-weight:bold;
}

input,select{
width:100%;
padding:12px;
margin-top:5px;
border-radius:8px;
border:1px solid #ccc;
}

button.action{
margin-top:20px;
padding:12px;
border:none;
border-radius:8px;
background:#0d6efd;
color:white;
font-weight:bold;
cursor:pointer;
width:100%;
}

button.secondary{
background:#6c757d;
}

.triagem-box{
padding:25px;
border-radius:16px;
text-align:center;
font-size:22px;
font-weight:bold;
color:white;
margin-top:20px;
}

.painel{
background:#111;
color:#00ff88;
padding:30px;
border-radius:16px;
text-align:center;
font-size:30px;
font-weight:bold;
margin-top:20px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th,td{
border:1px solid #ccc;
padding:10px;
text-align:center;
}

th{
background:#e9f1fb;
}
</style>
</head>

<body>

<header>
<h1>🩺 TriageAI</h1>
<p>Sistema Inteligente</p>
</header>

<div class="container">

<!-- LOGIN -->
<div class="card" id="inicio">

<h2>Login</h2>

<input id="loginCpf" placeholder="CPF">
<input type="password" id="loginSenha" placeholder="Senha">

<button class="action" onclick="fazerLogin()">Entrar</button>

<p id="loginMsg"></p>

<hr>

<button class="action secondary" onclick="mostrar('cadastro')">
Criar Conta
</button>

</div>

<!-- CADASTRO -->
<div class="card hidden" id="cadastro">

<h2>Criar Conta</h2>

<label>Nome</label>
<input id="cadNome">

<label>CPF</label>
<input id="cadCpf">

<label>Telefone</label>
<input id="cadTel">

<label>Idade</label>
<input type="number" id="cadIdade">

<label>Senha</label>
<input type="password" id="cadSenha">

<button class="action" onclick="cadastrarPaciente()">
Criar Conta
</button>

<p id="cadMsg"></p>

<button class="action secondary" onclick="mostrar('inicio')">
⬅ Voltar
</button>

</div>

<!-- SISTEMA -->
<div class="card hidden" id="sistema">

<h2>🩺 Triagem</h2>

<input type="number" id="temperatura" placeholder="Temperatura">
<input type="number" id="idadePaciente" placeholder="Idade">
<input type="number" id="pressaoSis" placeholder="Pressão Sistólica">
<input type="number" id="saturacao" placeholder="Saturação">
<input type="number" id="batimentos" placeholder="Batimentos">

<select id="dor">
<option value="0">Sem dor</option>
<option value="1">Leve</option>
<option value="2">Moderada</option>
<option value="3">Intensa</option>
</select>

<select id="faltaAr">
<option>Não</option>
<option>Sim</option>
</select>

<button class="action" onclick="avaliarTriagem()">
Avaliar Triagem
</button>

<div id="resultadoTriagem"></div>

<hr>

<button class="action" onclick="gerarSenha()">
Gerar Senha
</button>

<div id="senhaGerada"></div>

<hr>

<button class="action secondary" onclick="logout()">
Sair
</button>

</div>

</div>

<script>

let usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];
let fila = JSON.parse(localStorage.getItem("fila")) || [];
let usuarioLogado = null;
let ultimaClassificacao = "";

function salvar(){
localStorage.setItem("usuarios",JSON.stringify(usuarios));
localStorage.setItem("fila",JSON.stringify(fila));
}

function mostrar(id){
["inicio","cadastro","sistema"].forEach(e=>{
document.getElementById(e).classList.add("hidden");
});
document.getElementById(id).classList.remove("hidden");
}

function cadastrarPaciente(){

if(!cadNome.value || !cadCpf.value || !cadSenha.value){
cadMsg.innerText="Preencha os campos obrigatórios.";
cadMsg.style.color="red";
return;
}

if(usuarios.find(u=>u.cpf===cadCpf.value)){
cadMsg.innerText="CPF já cadastrado.";
cadMsg.style.color="red";
return;
}

usuarios.push({
nome:cadNome.value,
cpf:cadCpf.value,
telefone:cadTel.value,
idade:cadIdade.value,
senha:cadSenha.value
});

salvar();

cadMsg.innerText="Conta criada!";
cadMsg.style.color="green";

setTimeout(()=>mostrar("inicio"),1000);
}

function fazerLogin(){

let user=usuarios.find(
u=>u.cpf===loginCpf.value && u.senha===loginSenha.value
);

if(!user){
loginMsg.innerText="CPF ou senha inválidos.";
loginMsg.style.color="red";
return;
}

usuarioLogado=user;

mostrar("sistema");
}

function avaliarTriagem(){

let pontos=0;

if(temperatura.value>=38)pontos+=2;
if(idadePaciente.value>=60)pontos+=2;
if(pressaoSis.value>=160)pontos+=3;
if(saturacao.value<=90)pontos+=4;
if(batimentos.value>=120)pontos+=3;
pontos+=parseInt(dor.value);
if(faltaAr.value==="Sim")pontos+=4;

if(pontos>=10)ultimaClassificacao="🔴 EMERGÊNCIA";
else if(pontos>=7)ultimaClassificacao="🟠 URGENTE";
else if(pontos>=4)ultimaClassificacao="🟡 ATENÇÃO";
else ultimaClassificacao="🟢 BAIXO";

resultadoTriagem.innerHTML=
"<div class='triagem-box' style='background:#0d6efd'>"+
ultimaClassificacao+
"</div>";
}

function gerarSenha(){

if(!usuarioLogado){alert("Faça login.");return;}

if(!ultimaClassificacao){alert("Faça triagem.");return;}

let numero="S"+(fila.length+1);

fila.push({
senha:numero,
paciente:usuarioLogado.nome,
prioridade:ultimaClassificacao
});

salvar();

senhaGerada.innerHTML=
"<h2>"+numero+"</h2>";
}

function logout(){
location.reload();
}

</script>

</body>
</html>
