<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Viscontrol - Sistema</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:#000;
color:white;
}

/* LOGIN */
.login{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
text-align:center;
width:90%;
max-width:400px;
}

.logo-login{
width:220px;
margin-bottom:20px;
}

/* INPUT */
input, select{
padding:12px;
margin:10px 0;
width:100%;
border-radius:8px;
border:none;
}

button{
padding:12px;
border:none;
background:#2563eb;
color:white;
border-radius:8px;
cursor:pointer;
}

.logout{background:red}

/* APP */
#app{
display:none;
padding:20px;
min-height:100vh;
}

.container{
max-width:1100px;
margin:auto;
}

/* TOPO */
.topo{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

/* CARDS */
.barra{
display:flex;
flex-wrap:wrap;
gap:10px;
margin-bottom:20px;
}

.card{
flex:1;
background:#1e293b;
padding:20px;
border-radius:12px;
text-align:center;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-bottom:20px;
}

.section{
background:#0f172a;
padding:20px;
border-radius:15px;
margin-bottom:20px;
}

.section h3{
margin-top:0;
color:#60a5fa;
}

/* TABELA */
table{
width:100%;
border-collapse:collapse;
}

th{
background:#2563eb;
padding:10px;
}

td{
padding:10px;
border-bottom:1px solid #333;
}

.ganho{color:#22c55e;}
.gasto{color:#ef4444;}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login" id="login">
<div class="box">
<img src="logo.png" class="logo-login">
<h1>Viscontrol</h1>

<input id="user" placeholder="Usuário">
<input id="pass" type="password" placeholder="Senha">

<button onclick="entrar()">Entrar</button>

<p>
<span onclick="abrirCadastro()" style="cursor:pointer;color:#60a5fa;">Criar conta</span>
</p>
</div>
</div>

<!-- CADASTRO -->
<div class="login" id="cadastro" style="display:none;">
<div class="box">
<h2>Criar Conta</h2>

<input id="novoUserCad" placeholder="Usuário">
<input id="novaSenhaCad" type="password" placeholder="Senha">

<button onclick="criarConta()">Cadastrar</button>

<p onclick="voltarLogin()" style="cursor:pointer;">Voltar</p>
</div>
</div>

<!-- APP -->
<div id="app">

<div class="topo">
<h2>Controle Financeiro</h2>
<div>
<button onclick="abrirConfig()">Configurações</button>
<button class="logout" onclick="sair()">Sair</button>
</div>
</div>

<div class="container">

<!-- RESUMO -->
<div class="barra">
<div class="card">💰 Ganhos: R$ <span id="ganhos">0</span></div>
<div class="card">💸 Gastos: R$ <span id="gastos">0</span></div>
<div class="card">📊 Lucro: R$ <span id="lucro">0</span></div>
</div>

<!-- LANÇAMENTO -->
<div class="section">
<h3>➕ Adicionar Lançamento</h3>
<div class="barra">
<input type="date" id="data">
<input id="desc" placeholder="Descrição">
<select id="tipo">
<option value="ganho">Ganho</option>
<option value="gasto">Gasto</option>
</select>
<input id="cat" placeholder="Categoria">
<input type="number" id="valor" placeholder="Valor">
<button onclick="add()">Adicionar</button>
<button onclick="limpar()">Limpar</button>
</div>
</div>

<!-- GRÁFICOS -->
<div class="grid">
<div class="section">
<h3>📊 Resumo</h3>
<canvas id="grafico"></canvas>
</div>

<div class="section">
<h3>📈 Evolução Mensal</h3>
<canvas id="graficoMes"></canvas>
</div>
</div>

<!-- RELATÓRIO -->
<div class="section">
<h3>🧾 Relatório</h3>

<select id="tipoRelatorio">
<option value="mes">Mês atual</option>
<option value="ano">Ano</option>
<option value="personalizado">Personalizado</option>
</select>

<input type="date" id="inicioRelatorio">
<input type="date" id="fimRelatorio">

<button onclick="gerarRelatorio()">Gerar</button>
<button onclick="exportarRelatorio()">Gerar PDF</button>

<div id="resultadoRelatorio"></div>
</div>

<!-- TABELA -->
<div class="section">
<h3>📋 Lançamentos</h3>

<table>
<thead>
<tr>
<th>Data</th>
<th>Descrição</th>
<th>Tipo</th>
<th>Categoria</th>
<th>Valor</th>
<th>Ação</th>
</tr>
</thead>
<tbody id="tabela"></tbody>
</table>
</div>

</div>
</div>

<!-- CONFIG -->
<div id="config" style="display:none; padding:20px;">
<h2>⚙️ Configurações</h2>

<div style="max-width:400px;margin:auto;">
<input id="novoUser" placeholder="Novo usuário">
<input id="novaSenha" type="password" placeholder="Nova senha">

<button onclick="salvarConfig()">Salvar</button>
<button onclick="voltar()">Voltar</button>
</div>
</div>

<script>
const { jsPDF } = window.jspdf;

/* USUÁRIOS */
let usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];

if(usuarios.length===0){
usuarios.push({user:"admin",senha:"123"});
localStorage.setItem("usuarios",JSON.stringify(usuarios));
}

/* LOGIN */
function entrar(){
let u=user.value;
let s=pass.value;

let ok=usuarios.find(x=>x.user===u && x.senha===s);

if(ok){
login.style.display="none";
app.style.display="block";
render();
}else alert("Login inválido");
}

function sair(){location.reload();}

/* CONFIG */
function abrirConfig(){
app.style.display="none";
config.style.display="block";
}

function voltar(){
config.style.display="none";
app.style.display="block";
}

function salvarConfig(){
if(novoUser.value) localStorage.setItem("user",novoUser.value);
if(novaSenha.value) localStorage.setItem("senha",novaSenha.value);
alert("Atualizado!");
}

/* CADASTRO */
function abrirCadastro(){
login.style.display="none";
cadastro.style.display="flex";
}

function voltarLogin(){
cadastro.style.display="none";
login.style.display="flex";
}

function criarConta(){
let u=novoUserCad.value;
let s=novaSenhaCad.value;

if(!u||!s){alert("Preencha tudo");return;}

if(usuarios.find(x=>x.user===u)){
alert("Já existe");return;
}

usuarios.push({user:u,senha:s});
localStorage.setItem("usuarios",JSON.stringify(usuarios));

alert("Conta criada!");
voltarLogin();
}

/* DADOS */
let dados = JSON.parse(localStorage.getItem("dados")) || [];

function salvar(){
localStorage.setItem("dados",JSON.stringify(dados));
}

function add(){
let item={
data:data.value,
desc:desc.value,
tipo:tipo.value,
cat:cat.value,
valor:Number(valor.value)
};

if(item.data && item.desc && item.valor){
dados.push(item);
salvar();
render();
}
}

function del(i){
dados.splice(i,1);
salvar();
render();
}

function limpar(){
if(confirm("Apagar tudo?")){
dados=[];
salvar();
render();
}
}

/* RELATÓRIO + PDF */
let relatorioAtual=[];

function gerarRelatorio(){
let tipo=tipoRelatorio.value;
let hoje=new Date();

if(tipo==="mes"){
let m=hoje.toISOString().slice(0,7);
relatorioAtual=dados.filter(d=>d.data.startsWith(m));
}
else if(tipo==="ano"){
let a=hoje.getFullYear();
relatorioAtual=dados.filter(d=>d.data.startsWith(a));
}
else{
relatorioAtual=dados.filter(d=>d.data>=inicioRelatorio.value && d.data<=fimRelatorio.value);
}

let g=0,s=0;

relatorioAtual.forEach(d=>{
if(d.tipo==="ganho") g+=d.valor;
else s+=d.valor;
});

resultadoRelatorio.innerHTML=`Ganhos: ${g} | Gastos: ${s} | Lucro: ${g-s}`;
}

function exportarRelatorio(){
if(relatorioAtual.length===0){
alert("Gere primeiro!");
return;
}

let doc=new jsPDF();
doc.text("Relatório Financeiro",20,20);

let y=40;

relatorioAtual.forEach(d=>{
doc.text(`${d.data} ${d.desc} ${d.tipo} R$${d.valor}`,20,y);
y+=10;
});

doc.save("relatorio.pdf");
}

/* GRÁFICOS */
let chart,chartMes;

function render(){

tabela.innerHTML="";
let g=0,s=0;

dados.forEach((d,i)=>{
if(d.tipo==="ganho") g+=d.valor;
else s+=d.valor;

tabela.innerHTML+=`
<tr>
<td>${d.data}</td>
<td>${d.desc}</td>
<td class="${d.tipo}">${d.tipo}</td>
<td>${d.cat}</td>
<td>${d.valor}</td>
<td><button onclick="del(${i})">X</button></td>
</tr>`;
});

ganhos.innerText=g;
gastos.innerText=s;
lucro.innerText=g-s;

if(chart) chart.destroy();
chart=new Chart(grafico,{
type:'bar',
data:{labels:['Ganhos','Gastos'],datasets:[{data:[g,s]}]}
});

let meses={};

dados.forEach(d=>{
let m=d.data.substring(0,7);
if(!meses[m]) meses[m]=0;
meses[m]+= d.tipo==="ganho"?d.valor:-d.valor;
});

if(chartMes) chartMes.destroy();
chartMes=new Chart(graficoMes,{
type:'line',
data:{labels:Object.keys(meses),datasets:[{data:Object.values(meses)}]}
});
}
</script>

</body>
</html>
