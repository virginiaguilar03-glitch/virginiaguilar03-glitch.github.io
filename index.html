<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Bar Rocha - Sistema</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:#000;
color:white;
}

/* LOGIN */
.login{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
text-align:center;
width:90%;
max-width:400px;
}

.logo-login{
width:220px;
border-radius:20px; /* arredondado leve */
margin-bottom:20px;
}

/* INPUT */
input{
padding:12px;
margin:10px 0;
width:100%;
border-radius:8px;
border:none;
}

/* BOTÃO */
button{
padding:12px;
border:none;
background:#2563eb;
color:white;
border-radius:8px;
cursor:pointer;
width:100%;
margin-top:5px;
}

/* APP */
#app{
display:none;
padding:20px;
background:#f1f5f9;
color:black;
min-height:100vh;
}

/* TOPO */
.topo{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.logo-img{
width:50px;
height:50px;
border-radius:50%;
}

/* CONTAINER */
.container{
max-width:1100px;
margin:auto;
background:white;
padding:25px;
border-radius:20px;
}

.barra{
display:flex;
flex-wrap:wrap;
gap:10px;
}

.card{
flex:1;
background:#eef3ff;
padding:15px;
border-radius:10px;
text-align:center;
}

table{
width:100%;
margin-top:20px;
border-collapse:collapse;
}

th{
background:#2563eb;
color:white;
padding:10px;
}

td{
padding:10px;
border-bottom:1px solid #eee;
}

.logout{
background:red;
width:auto;
padding:10px 20px;
}

.ganho{color:green;}
.gasto{color:red;}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login" id="login">
<div class="box">

<img src="logo.png" class="logo-login">

<h1>Bar Rocha</h1>
<p>Sistema financeiro</p>

<input id="user" placeholder="Usuário">
<input id="pass" type="password" placeholder="Senha">

<button onclick="entrar()">Entrar</button>

</div>
</div>

<!-- APP -->
<div id="app">

<div class="topo">
<div style="display:flex;align-items:center;gap:10px;">
<img src="logo.png" class="logo-img">
<h2>Controle Financeiro</h2>
</div>

<div>
<button onclick="abrirSenha()">Trocar Senha</button>
<button class="logout" onclick="sair()">Sair</button>
</div>
</div>

<div class="container">

<!-- FORM -->
<div class="barra">
<input type="date" id="data">
<input id="desc" placeholder="Descrição">
<select id="tipo">
<option value="ganho">Ganho</option>
<option value="gasto">Gasto</option>
</select>
<input id="cat" placeholder="Categoria">
<input type="number" id="valor" placeholder="Valor">

<button onclick="add()">Adicionar</button>
<button onclick="limpar()">Limpar</button>
</div>

<!-- RESUMO -->
<div class="barra">
<div class="card">Ganhos: R$ <span id="ganhos">0</span></div>
<div class="card">Gastos: R$ <span id="gastos">0</span></div>
<div class="card">Lucro: R$ <span id="lucro">0</span></div>
</div>

<!-- GRÁFICO -->
<canvas id="grafico" height="100"></canvas>

<!-- TABELA -->
<table>
<thead>
<tr>
<th>Data</th>
<th>Descrição</th>
<th>Tipo</th>
<th>Categoria</th>
<th>Valor</th>
<th>Ação</th>
</tr>
</thead>
<tbody id="tabela"></tbody>
</table>

</div>
</div>

<script>

/* SENHA */
if(!localStorage.getItem("senha")){
localStorage.setItem("senha","123");
}

/* LOGIN */
function entrar(){
let senha = localStorage.getItem("senha");

if(user.value==="admin" && pass.value===senha){
login.style.display="none";
app.style.display="block";
render();
}else{
alert("Login inválido");
}
}

/* TROCAR SENHA */
function abrirSenha(){
let atual = prompt("Digite a senha atual:");
let senha = localStorage.getItem("senha");

if(atual === senha){
let nova = prompt("Digite a nova senha:");
if(nova){
localStorage.setItem("senha",nova);
alert("Senha alterada!");
}
}else{
alert("Senha incorreta");
}
}

/* SAIR */
function sair(){
location.reload();
}

/* DADOS */
let dados = JSON.parse(localStorage.getItem("dados")) || [];

function add(){
let item={
data:data.value,
desc:desc.value,
tipo:tipo.value,
cat:cat.value,
valor:Number(valor.value)
};

if(item.data && item.desc && item.valor){
dados.push(item);
salvar();
render();
}
}

function salvar(){
localStorage.setItem("dados",JSON.stringify(dados));
}

function del(i){
dados.splice(i,1);
salvar();
render();
}

function limpar(){
if(confirm("Deseja apagar tudo?")){
dados=[];
salvar();
render();
}
}

/* GRÁFICO */
let chart;

function atualizarGrafico(ganho,gasto){

if(chart) chart.destroy();

chart = new Chart(document.getElementById("grafico"),{
type:'bar',
data:{
labels:['Ganhos','Gastos'],
datasets:[{
data:[ganho,gasto]
}]
}
});
}

/* RENDER */
function render(){

tabela.innerHTML="";
let ganho=0,gasto=0;

dados.forEach((d,i)=>{

if(d.tipo==="ganho") ganho+=d.valor;
else gasto+=d.valor;

tabela.innerHTML+=`
<tr>
<td>${d.data}</td>
<td>${d.desc}</td>
<td class="${d.tipo}">${d.tipo}</td>
<td>${d.cat}</td>
<td>R$ ${d.valor}</td>
<td><button onclick="del(${i})">X</button></td>
</tr>
`;
});

ganhos.innerText=ganho;
gastos.innerText=gasto;
lucro.innerText=ganho-gasto;

atualizarGrafico(ganho,gasto);
}

</script>

</body>
</html>
```
