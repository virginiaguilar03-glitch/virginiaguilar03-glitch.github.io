
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Bar Rocha - Sistema</title>

<style>
body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:#000;
color:white;
overflow:hidden;
}

/* FUNDO ANIMADO */
canvas{
position:fixed;
top:0;
left:0;
z-index:0;
}

/* LOGIN */
.login{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
position:relative;
z-index:1;
}

/* BOX */
.box{
text-align:center;
max-width:400px;
width:90%;
}

/* LOGO */
.logo-login{
width:230px;
max-width:80%;
margin-bottom:20px;
border-radius:50%;
box-shadow:0 0 25px #2563eb;
animation:entrada 1.5s ease, brilho 2s infinite alternate;
}

/* ANIMAÇÕES */
@keyframes entrada{
0%{transform:scale(0.7);opacity:0;}
100%{transform:scale(1);opacity:1;}
}

@keyframes brilho{
from{box-shadow:0 0 10px #2563eb;}
to{box-shadow:0 0 35px #3b82f6;}
}

/* TEXTO */
.titulo{
font-size:32px;
margin:10px 0 0;
}

.sub{
color:#aaa;
margin-bottom:30px;
}

/* INPUT */
input{
padding:12px;
margin:10px 0;
width:100%;
border-radius:8px;
border:none;
outline:none;
}

/* BOTÃO */
button{
padding:12px;
border:none;
background:#2563eb;
color:white;
border-radius:8px;
cursor:pointer;
width:100%;
font-size:15px;
transition:0.3s;
}

button:hover{
background:#1e40af;
}

/* APP */
#app{
display:none;
padding:20px;
background:linear-gradient(135deg,#eef2ff,#f8fafc);
color:black;
min-height:100vh;
}

/* RESTO */
.topo{
display:flex;
align-items:center;
gap:15px;
margin-bottom:20px;
}

.logo-img{
width:50px;
height:50px;
border-radius:50%;
object-fit:cover;
}

.container{
max-width:1100px;
margin:auto;
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

.barra{
display:flex;
flex-wrap:wrap;
gap:10px;
}

.card{
flex:1;
background:#eef3ff;
padding:15px;
border-radius:10px;
text-align:center;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th{
background:#2563eb;
color:white;
padding:10px;
}

td{
padding:10px;
border-bottom:1px solid #eee;
}

.ganho{color:green;}
.gasto{color:red;}

.logout{
margin-top:10px;
background:red;
}
</style>
</head>

<body>

<!-- FUNDO -->
<canvas id="bg"></canvas>

<!-- LOGIN -->
<div class="login" id="login">
  <div class="box">

    <img src="logo.png" class="logo-login">

    <h1 class="titulo">Bar Rocha</h1>
    <p class="sub">Desde 2010</p>

    <input id="user" placeholder="Usuário">
    <input id="pass" type="password" placeholder="Senha">

    <button onclick="entrar()">Entrar</button>

  </div>
</div>

<!-- APP -->
<div id="app">
<div class="topo">
<img src="logo.png" class="logo-img">
<h2>Controle Financeiro</h2>
</div>

<div class="container">

<div class="barra">
<input type="date" id="data">
<input id="desc" placeholder="Descrição">
<select id="tipo">
<option value="ganho">Ganho</option>
<option value="gasto">Gasto</option>
</select>
<input id="cat" placeholder="Categoria">
<input type="number" id="valor" placeholder="Valor">

<button onclick="add()">Adicionar</button>
<button onclick="limpar()">Limpar</button>
</div>

<div class="barra">
<div class="card">Ganhos: R$ <span id="ganhos">0</span></div>
<div class="card">Gastos: R$ <span id="gastos">0</span></div>
<div class="card">Lucro: R$ <span id="lucro">0</span></div>
</div>

<table>
<thead>
<tr>
<th>Data</th>
<th>Descrição</th>
<th>Tipo</th>
<th>Categoria</th>
<th>Valor</th>
<th>Ação</th>
</tr>
</thead>
<tbody id="tabela"></tbody>
</table>

<button class="logout" onclick="sair()">Sair</button>

</div>
</div>

<script>

/* FUNDO ANIMADO */
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

for(let i=0;i<80;i++){
particles.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
r:Math.random()*2,
dx:(Math.random()-0.5),
dy:(Math.random()-0.5)
});
}

function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);

particles.forEach(p=>{
ctx.beginPath();
ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
ctx.fillStyle="white";
ctx.fill();

p.x+=p.dx;
p.y+=p.dy;

if(p.x<0||p.x>canvas.width) p.dx*=-1;
if(p.y<0||p.y>canvas.height) p.dy*=-1;
});

requestAnimationFrame(draw);
}

draw();

/* SISTEMA */
let dados = JSON.parse(localStorage.getItem("dados")) || [];

function entrar(){
if(user.value==="admin" && pass.value==="123"){
login.style.display="none";
app.style.display="block";
render();
}else{
alert("Login inválido");
}
}

function sair(){ location.reload(); }

function add(){
let item={
data:data.value,
desc:desc.value,
tipo:tipo.value,
cat:cat.value,
valor:Number(valor.value)
};

if(item.data && item.desc && item.valor){
dados.push(item);
salvar();
render();
}
}

function salvar(){
localStorage.setItem("dados",JSON.stringify(dados));
}

function del(i){
dados.splice(i,1);
salvar();
render();
}

function limpar(){
if(confirm("Deseja apagar tudo?")){
dados=[];
salvar();
render();
}
}

function render(){
tabela.innerHTML="";
let ganho=0,gasto=0;

dados.forEach((d,i)=>{
if(d.tipo==="ganho") ganho+=d.valor;
else gasto+=d.valor;

tabela.innerHTML+=`
<tr>
<td>${d.data}</td>
<td>${d.desc}</td>
<td class="${d.tipo}">${d.tipo}</td>
<td>${d.cat}</td>
<td>R$ ${d.valor}</td>
<td><button onclick="del(${i})">X</button></td>
</tr>`;
});

ganhos.innerText=ganho;
gastos.innerText=gasto;
lucro.innerText=ganho-gasto;
}
</script>

</body>
</html>
```
