<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Viscontrol - Sistema</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:#000;
color:white;
}

.login{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
text-align:center;
width:90%;
max-width:400px;
}

.logo-login{
width:220px;
border-radius:20px;
margin-bottom:20px;
}

input, select{
padding:12px;
margin:10px 0;
width:100%;
border-radius:8px;
border:none;
}

button{
padding:12px;
border:none;
background:#2563eb;
color:white;
border-radius:8px;
cursor:pointer;
width:100%;
margin-top:5px;
}

#app{
display:none;
padding:20px;
min-height:100vh;
}

.topo{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.logo-img{
width:50px;
height:50px;
border-radius:50%;
}

.container{
max-width:1100px;
margin:auto;
}

.barra{
display:flex;
flex-wrap:wrap;
gap:10px;
margin-bottom:20px;
}

.card{
flex:1;
background:#1e293b;
padding:20px;
border-radius:12px;
text-align:center;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-top:20px;
}

.section{
background:#0f172a;
padding:20px;
border-radius:15px;
}

.section h3{
margin-bottom:10px;
color:#60a5fa;
}

canvas{
background:#0f172a;
border-radius:15px;
padding:10px;
}

table{
width:100%;
margin-top:10px;
border-collapse:collapse;
}

th{
background:#2563eb;
padding:10px;
}

td{
padding:10px;
border-bottom:1px solid #333;
}

.logout{
background:red;
width:auto;
padding:10px 20px;
}

.ganho{color:#22c55e;}
.gasto{color:#ef4444;}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login" id="login">
<div class="box">
<img src="logo.png" class="logo-login">
<h1>Viscontrol</h1>
<p>Sistema financeiro</p>

<input id="user" placeholder="Usuário">
<input id="pass" type="password" placeholder="Senha">

<button onclick="entrar()">Entrar</button>

<p>
Não tem conta? 
<span onclick="abrirCadastro()" style="color:#60a5fa;cursor:pointer;">Criar conta</span>
</p>
</div>
</div>

<!-- CADASTRO -->
<div class="login" id="cadastro" style="display:none;">
<div class="box">
<img src="logo.png" class="logo-login">
<h1>Criar Conta</h1>

<input id="novoUserCad" placeholder="Usuário">
<input id="novaSenhaCad" type="password" placeholder="Senha">

<button onclick="criarConta()">Cadastrar</button>

<p>
Já tem conta? 
<span onclick="voltarLogin()" style="color:#60a5fa;cursor:pointer;">Entrar</span>
</p>
</div>
</div>

<!-- APP -->
<div id="app">

<div class="topo">
<div style="display:flex;gap:10px;align-items:center;">
<img src="logo.png" class="logo-img">
<h2>Controle Financeiro</h2>
</div>

<div>
<button onclick="abrirConfig()">Configurações</button>
<button class="logout" onclick="sair()">Sair</button>
</div>
</div>

<div class="container">

<!-- RESUMO -->
<div class="barra">
<div class="card">💰 Ganhos<br><strong>R$ <span id="ganhos">0</span></strong></div>
<div class="card">💸 Gastos<br><strong>R$ <span id="gastos">0</span></strong></div>
<div class="card">📊 Lucro<br><strong>R$ <span id="lucro">0</span></strong></div>
</div>

<!-- NOVO -->
<div class="section">
<h3>➕ Novo Lançamento</h3>
<div class="barra">
<input type="date" id="data">
<input id="desc" placeholder="Descrição">
<select id="tipo">
<option value="ganho">Ganho</option>
<option value="gasto">Gasto</option>
</select>
<input id="cat" placeholder="Categoria">
<input type="number" id="valor" placeholder="Valor">
<button onclick="add()">Adicionar</button>
</div>
</div>

<!-- GRÁFICOS -->
<div class="grid">
<div class="section">
<h3>📊 Resumo</h3>
<canvas id="grafico"></canvas>
</div>

<div class="section">
<h3>📈 Evolução Mensal</h3>
<canvas id="graficoMes"></canvas>
</div>
</div>

<!-- AÇÕES -->
<div class="grid">
<div class="section">
<h3>⚙️ Ações</h3>
<div class="barra">
<button onclick="exportar()">Exportar Excel</button>
<button onclick="fechamento()">Fechar Caixa</button>
<button onclick="limpar()">Limpar Tudo</button>
</div>
</div>

<div class="section">
<h3>🔎 Filtro</h3>
<div class="barra">
<input type="date" id="filtroData">
<button onclick="filtrar()">Filtrar</button>
<button onclick="limparFiltro()">Limpar</button>
</div>
</div>
</div>

<!-- RELATÓRIO -->
<div class="section">
<h3>🧾 Gerar Relatório</h3>

<div class="barra">
<select id="tipoRelatorio">
<option value="mes">Mês atual</option>
<option value="ano">Ano atual</option>
<option value="personalizado">Personalizado</option>
</select>

<input type="date" id="inicioRelatorio">
<input type="date" id="fimRelatorio">

<button onclick="gerarRelatorio()">Gerar</button>
<button onclick="exportarRelatorio()">Exportar</button>
</div>

<div id="resultadoRelatorio"></div>
</div>

<!-- TABELA -->
<div class="section">
<h3>📋 Histórico</h3>
<table>
<thead>
<tr>
<th>Data</th>
<th>Descrição</th>
<th>Tipo</th>
<th>Categoria</th>
<th>Valor</th>
<th>Ação</th>
</tr>
</thead>
<tbody id="tabela"></tbody>
</table>
</div>

</div>
</div>

<script>

/* ELEMENTOS */
const loginDiv = document.getElementById("login");
const appDiv = document.getElementById("app");
const cadastroDiv = document.getElementById("cadastro");

/* USUÁRIOS */
let usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];

if(usuarios.length === 0){
usuarios.push({user:"admin", senha:"123"});
localStorage.setItem("usuarios", JSON.stringify(usuarios));
}

/* LOGIN */
function entrar(){
let u = document.getElementById("user").value;
let s = document.getElementById("pass").value;

let achou = usuarios.find(x => x.user === u && x.senha === s);

if(achou){
loginDiv.style.display="none";
appDiv.style.display="block";
render();
}else{
alert("Login inválido");
}
}

function sair(){location.reload();}

/* CADASTRO */
function abrirCadastro(){
loginDiv.style.display="none";
cadastroDiv.style.display="flex";
}

function voltarLogin(){
cadastroDiv.style.display="none";
loginDiv.style.display="flex";
}

function criarConta(){
let u = document.getElementById("novoUserCad").value;
let s = document.getElementById("novaSenhaCad").value;

if(!u || !s){alert("Preencha tudo");return;}

let existe = usuarios.find(x => x.user === u);
if(existe){alert("Já existe");return;}

usuarios.push({user:u, senha:s});
localStorage.setItem("usuarios", JSON.stringify(usuarios));

alert("Conta criada");
voltarLogin();
}

/* DADOS */
let dados = JSON.parse(localStorage.getItem("dados")) || [];

function add(){
let item={
data:data.value,
desc:desc.value,
tipo:tipo.value,
cat:cat.value,
valor:Number(valor.value)
};

if(item.data && item.desc && item.valor){
dados.push(item);
salvar();
render();
}
}

function salvar(){
localStorage.setItem("dados",JSON.stringify(dados));
}

function del(i){
dados.splice(i,1);
salvar();
render();
}

function limpar(){
if(confirm("Apagar tudo?")){
dados=[];
salvar();
render();
}
}

/* RELATÓRIO */
let relatorioAtual=[];

function gerarRelatorio(){
let tipo=document.getElementById("tipoRelatorio").value;
let hoje=new Date();

if(tipo==="mes"){
let mes=hoje.toISOString().slice(0,7);
relatorioAtual=dados.filter(d=>d.data.startsWith(mes));
}
else if(tipo==="ano"){
let ano=hoje.getFullYear();
relatorioAtual=dados.filter(d=>d.data.startsWith(ano));
}
else{
let i=document.getElementById("inicioRelatorio").value;
let f=document.getElementById("fimRelatorio").value;
relatorioAtual=dados.filter(d=>d.data>=i && d.data<=f);
}

let ganhos=0,gastos=0;

relatorioAtual.forEach(d=>{
if(d.tipo==="ganho") ganhos+=d.valor;
else gastos+=d.valor;
});

let lucro=ganhos-gastos;

document.getElementById("resultadoRelatorio").innerHTML=
`<div class="card">
Ganhos: R$ ${ganhos}<br>
Gastos: R$ ${gastos}<br>
Lucro: R$ ${lucro}
</div>`;
}

function exportarRelatorio(){
if(relatorioAtual.length===0){
alert("Gere primeiro!");
return;
}

let csv="Data,Descricao,Tipo,Categoria,Valor\n";
relatorioAtual.forEach(d=>{
csv+=`${d.data},${d.desc},${d.tipo},${d.cat},${d.valor}\n`;
});

let blob=new Blob([csv]);
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="relatorio.csv";
a.click();
}

/* GRÁFICOS */
let chart, chartMes;

function render(){
let tabela=document.getElementById("tabela");
tabela.innerHTML="";
let g=0,s=0;

dados.forEach((d,i)=>{
if(d.tipo==="ganho") g+=d.valor;
else s+=d.valor;

tabela.innerHTML+=`
<tr>
<td>${d.data}</td>
<td>${d.desc}</td>
<td class="${d.tipo}">${d.tipo}</td>
<td>${d.cat}</td>
<td>${d.valor}</td>
<td><button onclick="del(${i})">X</button></td>
</tr>`;
});

document.getElementById("ganhos").innerText=g;
document.getElementById("gastos").innerText=s;
document.getElementById("lucro").innerText=g-s;

if(chart) chart.destroy();
chart=new Chart(document.getElementById("grafico"),{
type:'bar',
data:{
labels:['Ganhos','Gastos'],
datasets:[{data:[g,s]}]
},
options:{plugins:{legend:{display:false}}}
});

graficoMesFunc();
}

function graficoMesFunc(){
let meses={};

dados.forEach(d=>{
let m=d.data.substring(0,7);
if(!meses[m]) meses[m]=0;
if(d.tipo==="ganho") meses[m]+=d.valor;
else meses[m]-=d.valor;
});

let labels=Object.keys(meses);
let valores=Object.values(meses);

if(chartMes) chartMes.destroy();
chartMes=new Chart(document.getElementById("graficoMes"),{
type:'line',
data:{
labels:labels,
datasets:[{data:valores}]
},
options:{plugins:{legend:{display:false}}}
});
}

</script>

</body>
</html>
