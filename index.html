<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema UBS - Virgínia Aguilar</title>

<style>

body{
margin:0;
font-family: Arial, sans-serif;
background:#f4f8ff;
}

/* TOPO */
.topo{
background:#0d6efd;
color:white;
display:flex;
justify-content:space-between;
align-items:center;
padding:10px 30px;
}

.logo{
display:flex;
align-items:center;
gap:30px;
}

.logo img{
border-radius: 50%;
height:100px;
}

/* LOGIN (NÃO ALTERADO) */
.container-login{
max-width:400px;
margin:60px auto;
background:white;
padding:30px;
border-radius:25px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

input, select, button{
width:100%;
padding:10px;
margin-top:10px;
border-radius:6px;
border:1px solid #ccc;
}

button{
background:#0d6efd;
color:white;
border:none;
cursor:pointer;
}

button:hover{
background:#084298;
}

.logout{
background:red;
}

/* PAINEIS */
.painel{
display:none;
padding:30px;
}

.card{
background:white;
padding:20px;
margin:15px 0;
border-radius:10px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

/* MENU SUS */
.menu{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
}

.menu button{
padding:20px;
font-size:16px;
border-radius:10px;
}

/* LISTA */
.lista{
margin-top:10px;
background:#eef3ff;
padding:10px;
border-radius:10px;
}

/* CONFIG */
#configBox{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
}

.configContent{
background:white;
width:400px;
margin:100px auto;
padding:20px;
border-radius:10px;
}

</style>
</head>

<body>

<header class="topo">
<div class="logo">
<img src="https://virginiaguilar03-glitch.github.io/logo.png">
<div>
<h2 id="tituloSistema">Sistema UBS - Unidade Básica de Saúde</h2>
<p>Criado por Virgínia Aguilar • 2026</p>
</div>
</div>
</header>

<!-- LOGIN (INTACTO) -->
<div class="container-login" id="loginBox">

<h2>Login</h2>

<select id="tipoLogin">
<option value="admin">Administrador</option>
<option value="recepcao">Recepção</option>
<option value="paciente">Paciente</option>
</select>

<input type="text" id="usuario" placeholder="Login ou CPF">
<input type="password" id="senha" placeholder="Senha (admin/recepção)">

<button onclick="login()">Entrar</button>
<button onclick="criarConta()">Criar Conta Paciente</button>

</div>

<!-- MENU INICIAL -->
<div class="painel" id="menuInicial">

<h2>Bem-vindo ao Sistema UBS</h2>

<div class="menu">
<button onclick="mostrar('painelAdmin')">👨‍⚕️ Administração</button>
<button onclick="mostrar('painelRecepcao')">📋 Recepção</button>
<button onclick="mostrar('painelPaciente')">🧑 Paciente</button>
</div>

<button class="logout" onclick="logout()">Sair</button>

</div>

<!-- ADMIN -->
<div class="painel" id="painelAdmin">

<h2>Painel Administrador</h2>

<div class="card">
<input id="nomeMedico" placeholder="Nome do médico">
<button onclick="cadastrarMedico()">Cadastrar Médico</button>
</div>

<div class="card">
<input type="date" id="dataHorario">
<input type="time" id="horaHorario">
<button onclick="salvarHorario()">Salvar Horário</button>
</div>

<div class="card">
<button onclick="desmarcarConsulta()">Desmarcar Última Consulta</button>
</div>

<div class="lista" id="listaConsultas"></div>

<button onclick="abrirConfig()">Configurações</button>
<button class="logout" onclick="logout()">Sair</button>

</div>

<!-- RECEPÇÃO -->
<div class="painel" id="painelRecepcao">

<h2>Recepção</h2>

<div class="card">
<input id="nomeRecepcao" placeholder="Nome do paciente">
<input type="date" id="dataRecepcao">
<button onclick="marcarConsultaRecepcao()">Agendar</button>
</div>

<div class="lista" id="listaConsultas"></div>

<button class="logout" onclick="logout()">Sair</button>

</div>

<!-- PACIENTE -->
<div class="painel" id="painelPaciente">

<h2>Paciente</h2>

<div class="card">
<input type="date" id="dataPaciente">
<button onclick="marcarConsultaPaciente()">Marcar Consulta</button>
<button onclick="desmarcarConsulta()">Desmarcar</button>
</div>

<div class="lista" id="listaConsultas"></div>

<button class="logout" onclick="logout()">Sair</button>

</div>

<!-- CONFIG -->
<div id="configBox">
<div class="configContent">
<input type="text" id="novoTitulo" placeholder="Novo título">
<input type="color" id="novaCor">
<button onclick="salvarConfig()">Salvar</button>
<button onclick="fecharConfig()">Fechar</button>
</div>
</div>

<script>

let consultas = JSON.parse(localStorage.getItem("consultas")) || [];

/* LOGIN */
function login(){

let tipo=document.getElementById("tipoLogin").value;
let user=document.getElementById("usuario").value;
let senha=document.getElementById("senha").value;

if(
(tipo==="admin" && user==="master" && senha==="123admin") ||
(tipo==="recepcao" && user==="recepcao" && senha==="123recep") ||
(tipo==="paciente" && user.length>=11)
){
mostrar("menuInicial");
}else{
alert("Login inválido");
}
}

/* MOSTRAR */
function mostrar(id){
document.getElementById("loginBox").style.display="none";
document.querySelectorAll(".painel").forEach(p=>p.style.display="none");
document.getElementById(id).style.display="block";
atualizarLista();
}

function logout(){ location.reload(); }

/* CONSULTAS */
function salvar(){
localStorage.setItem("consultas", JSON.stringify(consultas));
}

function atualizarLista(){
let listas = document.querySelectorAll("#listaConsultas");

listas.forEach(div=>{
if(consultas.length===0){
div.innerHTML="Nenhuma consulta";
}else{
div.innerHTML = consultas.map(c =>
"👤 "+c.nome+" - 📅 "+c.data
).join("<br>");
}
});
}

function marcarConsultaPaciente(){
let data=dataPaciente.value;
if(data){
consultas.push({nome:"Paciente",data});
salvar(); atualizarLista();
}
}

function marcarConsultaRecepcao(){
let nome=nomeRecepcao.value;
let data=dataRecepcao.value;
if(nome && data){
consultas.push({nome,data});
salvar(); atualizarLista();
}
}

function desmarcarConsulta(){
consultas.pop();
salvar(); atualizarLista();
}

/* MÉDICO */
function cadastrarMedico(){
alert("Médico cadastrado (simulação)");
}

/* HORARIO */
function salvarHorario(){
alert("Horário salvo");
}

/* CONFIG */
function abrirConfig(){
configBox.style.display="block";
}

function fecharConfig(){
configBox.style.display="none";
}

function salvarConfig(){
if(novoTitulo.value){
tituloSistema.innerText=novoTitulo.value;
}
if(novaCor.value){
document.querySelector(".topo").style.background=novaCor.value;
}
fecharConfig();
}

/* CONTA */
function criarConta(){
alert("Conta criada (simulação)");
}

</script>

</body>
</html>
