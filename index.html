<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Sistema Financeiro - Bar Rocha</title>

<style>
body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:#000;
color:white;
}

/* LOGIN FULL SCREEN */
.login{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:#000;
}

/* BOX CENTRAL */
.box{
text-align:center;
width:100%;
max-width:400px;
}

/* LOGO GRANDE */
.logo-login{
width:220px;
max-width:80%;
margin-bottom:20px;
animation:zoom 2s ease;
}

/* ANIMAÇÃO */
@keyframes zoom{
0%{transform:scale(0.8);opacity:0;}
100%{transform:scale(1);opacity:1;}
}

/* TITULO */
.titulo{
font-size:32px;
margin:10px 0 0;
}

/* SUB */
.sub{
color:#aaa;
margin-bottom:30px;
}

/* INPUT */
input{
padding:12px;
margin:10px 0;
width:100%;
border-radius:8px;
border:none;
outline:none;
}

/* BOTÃO */
button{
padding:12px;
border:none;
background:#2563eb;
color:white;
border-radius:8px;
cursor:pointer;
width:100%;
font-size:15px;
transition:0.3s;
}

button:hover{
background:#1e40af;
}

/* APP */
#app{
display:none;
padding:20px;
background:linear-gradient(135deg,#eef2ff,#f8fafc);
color:black;
min-height:100vh;
}

/* TOPO */
.topo{
display:flex;
align-items:center;
gap:15px;
margin-bottom:20px;
}

/* LOGO PEQUENA */
.logo-img{
width:50px;
height:50px;
border-radius:50%;
object-fit:cover;
}

/* CONTAINER */
.container{
max-width:1100px;
margin:auto;
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

.barra{
display:flex;
flex-wrap:wrap;
gap:10px;
}

.card{
flex:1;
background:#eef3ff;
padding:15px;
border-radius:10px;
text-align:center;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th{
background:#2563eb;
color:white;
padding:10px;
}

td{
padding:10px;
border-bottom:1px solid #eee;
}

.ganho{color:green;}
.gasto{color:red;}

.logout{
margin-top:10px;
background:red;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login" id="login">
  <div class="box">

    <img src="logo.png" class="logo-login">

    <h1 class="titulo">Bar Rocha</h1>
    <p class="sub">Desde 2010</p>

    <input id="user" placeholder="Usuário">
    <input id="pass" type="password" placeholder="Senha">

    <button onclick="entrar()">Entrar</button>

  </div>
</div>

<!-- APP -->
<div id="app">

<div class="topo">
<img src="logo.png" class="logo-img">
<h2>Controle Financeiro</h2>
</div>

<div class="container">

<div class="barra">
<input type="date" id="data">
<input id="desc" placeholder="Descrição">
<select id="tipo">
<option value="ganho">Ganho</option>
<option value="gasto">Gasto</option>
</select>
<input id="cat" placeholder="Categoria">
<input type="number" id="valor" placeholder="Valor">

<button onclick="add()">Adicionar</button>
<button onclick="limpar()">Limpar</button>
</div>

<div class="barra">
<div class="card">Ganhos: R$ <span id="ganhos">0</span></div>
<div class="card">Gastos: R$ <span id="gastos">0</span></div>
<div class="card">Lucro: R$ <span id="lucro">0</span></div>
</div>

<table>
<thead>
<tr>
<th>Data</th>
<th>Descrição</th>
<th>Tipo</th>
<th>Categoria</th>
<th>Valor</th>
<th>Ação</th>
</tr>
</thead>

<tbody id="tabela"></tbody>
</table>

<button class="logout" onclick="sair()">Sair</button>

</div>
</div>

<script>

let dados = JSON.parse(localStorage.getItem("dados")) || [];

/* LOGIN */
function entrar(){
if(user.value==="admin" && pass.value==="123"){
login.style.display="none";
app.style.display="block";
render();
}else{
alert("Login inválido");
}
}

function sair(){
location.reload();
}

/* ADD */
function add(){

let item={
data:data.value,
desc:desc.value,
tipo:tipo.value,
cat:cat.value,
valor:Number(valor.value)
};

if(item.data && item.desc && item.valor){
dados.push(item);
salvar();
render();
}
}

/* SALVAR */
function salvar(){
localStorage.setItem("dados",JSON.stringify(dados));
}

/* DELETE */
function del(i){
dados.splice(i,1);
salvar();
render();
}

/* LIMPAR */
function limpar(){
if(confirm("Deseja apagar tudo?")){
dados=[];
salvar();
render();
}
}

/* RENDER */
function render(){

tabela.innerHTML="";
let ganho=0,gasto=0;

dados.forEach((d,i)=>{

if(d.tipo==="ganho") ganho+=d.valor;
else gasto+=d.valor;

tabela.innerHTML+=`
<tr>
<td>${d.data}</td>
<td>${d.desc}</td>
<td class="${d.tipo}">${d.tipo}</td>
<td>${d.cat}</td>
<td>R$ ${d.valor}</td>
<td><button onclick="del(${i})">X</button></td>
</tr>
`;
});

ganhos.innerText=ganho;
gastos.innerText=gasto;
lucro.innerText=ganho-gasto;

}

</script>

</body>
</html>
```
