<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Bar Rocha - Sistema</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:#000;
color:white;
}

/* LOGIN */
.login{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
text-align:center;
width:90%;
max-width:400px;
}

.logo-login{
width:220px;
border-radius:20px;
margin-bottom:20px;
}

input, select{
padding:12px;
margin:10px 0;
width:100%;
border-radius:8px;
border:none;
}

button{
padding:12px;
border:none;
background:#2563eb;
color:white;
border-radius:8px;
cursor:pointer;
width:100%;
margin-top:5px;
}

/* APP */
#app{
display:none;
padding:20px;
background:#000;
min-height:100vh;
}

.topo{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.logo-img{
width:50px;
height:50px;
border-radius:50%;
}

.container{
max-width:1100px;
margin:auto;
}

/* NOVO DASHBOARD */
.grid{
display:grid;
grid-template-columns: 1fr 1fr;
gap:20px;
margin-top:20px;
}

.full{
grid-column:1 / -1;
}

.section{
background:#0f172a;
padding:20px;
border-radius:15px;
}

.section h3{
margin-bottom:10px;
color:#60a5fa;
}

.barra{
display:flex;
flex-wrap:wrap;
gap:10px;
}

.barra input,
.barra select{
flex:1;
min-width:120px;
}

.card{
flex:1;
background:#1e293b;
padding:15px;
border-radius:10px;
text-align:center;
}

canvas{
background:#0f172a;
border-radius:15px;
padding:10px;
}

table{
width:100%;
margin-top:10px;
border-collapse:collapse;
}

th{
background:#2563eb;
color:white;
padding:10px;
}

td{
padding:10px;
border-bottom:1px solid #333;
}

.logout{
background:red;
width:auto;
padding:10px 20px;
}

.ganho{color:#22c55e;}
.gasto{color:#ef4444;}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login" id="login">
<div class="box">
<img src="logo.png" class="logo-login">
<h1>Bar Rocha</h1>
<p>Sistema financeiro</p>
<input id="user" placeholder="Usuário">
<input id="pass" type="password" placeholder="Senha">
<button onclick="entrar()">Entrar</button>
</div>
</div>

<!-- APP -->
<div id="app">

<div class="topo">
<div style="display:flex;align-items:center;gap:10px;">
<img src="logo.png" class="logo-img">
<h2>Controle Financeiro</h2>
</div>

<div>
<button onclick="abrirConfig()">Configurações</button>
<button class="logout" onclick="sair()">Sair</button>
</div>
</div>

<div class="container">

<div class="section">
<h3>➕ Adicionar Lançamento</h3>
<div class="barra">
<input type="date" id="data">
<input id="desc" placeholder="Descrição">
<select id="tipo">
<option value="ganho">Ganho</option>
<option value="gasto">Gasto</option>
</select>
<input id="cat" placeholder="Categoria">
<input type="number" id="valor" placeholder="Valor">
<button onclick="add()">Adicionar</button>
<button onclick="limpar()">Limpar</button>
</div>
</div>

<div class="barra">
<div class="card">Ganhos: R$ <span id="ganhos">0</span></div>
<div class="card">Gastos: R$ <span id="gastos">0</span></div>
<div class="card">Lucro: R$ <span id="lucro">0</span></div>
</div>

<div class="grid">

<div class="section">
<h3>📊 Resumo</h3>
<canvas id="grafico" height="150"></canvas>
</div>

<div class="section">
<h3>📈 Mensal</h3>
<canvas id="graficoMes" height="150"></canvas>
</div>

<div class="section full">
<h3>📁 Ações</h3>
<div class="barra">
<button onclick="exportar()">Exportar Excel</button>
<button onclick="fechamento()">Fechar Caixa do Dia</button>
</div>
</div>

<div class="section full">
<h3>📅 Filtro</h3>
<div class="barra">
<input type="date" id="filtroData">
<button onclick="filtrar()">Filtrar</button>
<button onclick="limparFiltro()">Limpar</button>
</div>
</div>

<div class="section full">
<h3>📋 Lançamentos</h3>

<table>
<thead>
<tr>
<th>Data</th>
<th>Descrição</th>
<th>Tipo</th>
<th>Categoria</th>
<th>Valor</th>
<th>Ação</th>
</tr>
</thead>
<tbody id="tabela"></tbody>
</table>

</div>

</div>
</div>
</div>

<!-- CONFIG -->
<div id="config" style="display:none; padding:20px; background:#000; min-height:100vh;">
<h2>⚙️ Configurações</h2>

<div style="max-width:400px; margin:auto;">
<input id="novoUser" placeholder="Novo usuário">
<input id="novaSenha" type="password" placeholder="Nova senha">
<button onclick="salvarConfig()">Salvar</button>
<button onclick="voltar()">Voltar</button>
</div>

</div>

<script>

/* LOGIN CONFIG */
if(!localStorage.getItem("user")){
localStorage.setItem("user","admin");
localStorage.setItem("senha","123");
}

function entrar(){
if(user.value===localStorage.getItem("user") && pass.value===localStorage.getItem("senha")){
login.style.display="none";
app.style.display="block";
render();
}else{
alert("Login inválido");
}
}

function sair(){location.reload();}

function abrirConfig(){
app.style.display="none";
config.style.display="block";
}

function voltar(){
config.style.display="none";
app.style.display="block";
}

function salvarConfig(){
if(novoUser.value) localStorage.setItem("user",novoUser.value);
if(novaSenha.value) localStorage.setItem("senha",novaSenha.value);
alert("Atualizado!");
}

/* DADOS */
let dados = JSON.parse(localStorage.getItem("dados")) || [];

function add(){
let item={
data:data.value,
desc:desc.value,
tipo:tipo.value,
cat:cat.value,
valor:Number(valor.value)
};

if(item.data && item.desc && item.valor){
dados.push(item);
salvar();
render();
}
}

function salvar(){
localStorage.setItem("dados",JSON.stringify(dados));
}

function del(i){
dados.splice(i,1);
salvar();
render();
}

function limpar(){
if(confirm("Deseja apagar tudo?")){
dados=[];
salvar();
render();
}
}

/* EXPORTAR */
function exportar(){
let csv="Data,Descricao,Tipo,Categoria,Valor\n";
dados.forEach(d=>{
csv+=`${d.data},${d.desc},${d.tipo},${d.cat},${d.valor}\n`;
});
let blob=new Blob([csv]);
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="dados.csv";
a.click();
}

/* FECHAMENTO */
function fechamento(){
let hoje=new Date().toISOString().split("T")[0];
let g=0,s=0;

dados.forEach(d=>{
if(d.data===hoje){
if(d.tipo==="ganho") g+=d.valor;
else s+=d.valor;
}
});

alert(`Hoje\nGanhos: ${g}\nGastos: ${s}\nSaldo: ${g-s}`);
}

/* FILTRO */
function filtrar(){
let f=filtroData.value;
let lista=dados.filter(d=>d.data===f);
renderLista(lista);
}

function limparFiltro(){
render();
}

function renderLista(lista){
tabela.innerHTML="";
let g=0,s=0;

lista.forEach((d,i)=>{
if(d.tipo==="ganho") g+=d.valor;
else s+=d.valor;

tabela.innerHTML+=`
<tr>
<td>${d.data}</td>
<td>${d.desc}</td>
<td class="${d.tipo}">${d.tipo}</td>
<td>${d.cat}</td>
<td>${d.valor}</td>
<td><button onclick="del(${i})">X</button></td>
</tr>`;
});

ganhos.innerText=g;
gastos.innerText=s;
lucro.innerText=g-s;
}

/* GRÁFICOS */
let chart, chartMes;

function render(){

tabela.innerHTML="";
let g=0,s=0;

dados.forEach((d,i)=>{
if(d.tipo==="ganho") g+=d.valor;
else s+=d.valor;

tabela.innerHTML+=`
<tr>
<td>${d.data}</td>
<td>${d.desc}</td>
<td class="${d.tipo}">${d.tipo}</td>
<td>${d.cat}</td>
<td>${d.valor}</td>
<td><button onclick="del(${i})">X</button></td>
</tr>`;
});

ganhos.innerText=g;
gastos.innerText=s;
lucro.innerText=g-s;

if(chart) chart.destroy();
chart=new Chart(grafico,{
type:'bar',
data:{
labels:['Ganhos','Gastos'],
datasets:[{data:[g,s]}]
},
options:{
plugins:{legend:{display:false}}
}
});

graficoMesFunc();
}

function graficoMesFunc(){
let meses={};

dados.forEach(d=>{
let m=d.data.substring(0,7);
if(!meses[m]) meses[m]=0;
if(d.tipo==="ganho") meses[m]+=d.valor;
else meses[m]-=d.valor;
});

let labels=Object.keys(meses);
let valores=Object.values(meses);

if(chartMes) chartMes.destroy();
chartMes=new Chart(graficoMes,{
type:'line',
data:{
labels:labels,
datasets:[{data:valores}]
},
options:{
plugins:{legend:{display:false}}
}
});
}

</script>

</body>
</html>
