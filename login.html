<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrar | VaidTáxi</title>

    <!-- =====================================================
         FONTE
    ====================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


    <!-- =====================================================
         CSS
    ====================================================== -->

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/animations.css">

</head>


<body>


<!-- =========================================================
     CABEÇALHO
========================================================== -->

<header>

    <div class="container">

        <a href="index.html" class="logo">

            <img
                src="img/logo-vdb.png"
                alt="Logo VaidTáxi"
            >

            <h1>
                Vaid<span>Táxi</span>
            </h1>

        </a>


        <nav>

            <a href="index.html">
                Início
            </a>

            <a href="motoristas.html">
                Motoristas
            </a>

            <a href="corrida.html">
                Corridas
            </a>

            <a href="pagamentos.html">
                Pagamentos
            </a>

            <a href="contato.html">
                Contato
            </a>

        </nav>


        <div class="header-buttons">

            <a
                href="cadastro.html"
                class="btn"
            >
                Cadastre-se
            </a>

        </div>

    </div>

</header>



<!-- =========================================================
     CONTEÚDO PRINCIPAL
========================================================== -->

<main>


    <!-- =====================================================
         BANNER DA PÁGINA
    ====================================================== -->

    <section class="page-banner">

        <div class="container">

            <h1>
                Entrar
            </h1>

            <p>
                Acesse sua conta para solicitar corridas
                e acompanhar seu histórico.
            </p>

        </div>

    </section>



    <!-- =====================================================
         FORMULÁRIO DE LOGIN
    ====================================================== -->

    <section class="container">

        <form
            class="form-login"
            id="formLogin"
        >


            <!-- E-MAIL -->

            <div class="form-group">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    autocomplete="email"
                    required
                >

            </div>



            <!-- SENHA -->

            <div class="form-group">

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                    required
                >

            </div>



            <!-- BOTÃO -->

            <button
                class="btn"
                type="submit"
                id="btnLogin"
            >
                Entrar
            </button>



            <!-- MENSAGEM -->

            <p
                id="mensagemLogin"
                style="
                    margin-top: 15px;
                    text-align: center;
                    font-size: 14px;
                "
            ></p>



            <!-- CADASTRO -->

            <p
                style="
                    margin-top: 20px;
                    text-align: center;
                "
            >

                Ainda não possui conta?

                <a href="cadastro.html">
                    Cadastre-se
                </a>

            </p>


        </form>

    </section>


</main>



<!-- =========================================================
     RODAPÉ
========================================================== -->

<footer>

    <div class="container">

        <p>

            ©
            <span id="ano"></span>
            VaidTáxi - Todos os direitos reservados.

        </p>

    </div>

</footer>



<!-- =========================================================
     JAVASCRIPT
========================================================== -->

<script src="js/menu.js"></script>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>


<!-- LOGIN -->

<script src="js/login.js"></script>


<!-- =========================================================
     ANO DO RODAPÉ
========================================================== -->

<script>

    const elementoAno =
        document.getElementById("ano");

    if (elementoAno) {

        elementoAno.textContent =
            new Date().getFullYear();

    }

</script>


</body>

</html>
