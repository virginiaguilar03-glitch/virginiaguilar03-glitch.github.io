    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/animations.css">

<body>

<header>

    <div class="container">

        <a href="index.html" class="logo">

            <img src="img/logo-vdb.png" alt="Logo">

            <h1>Vaid<span>Táxi</span></h1>

        </a>

        <nav>

            <a href="index.html">Início</a>
            <a href="motoristas.html">Motoristas</a>
            <a href="corrida.html">Corridas</a>
            <a href="pagamentos.html">Pagamentos</a>
            <a href="contato.html">Contato</a>

        </nav>

        <div class="header-buttons">

            <a href="login.html" class="btn-outline">
                Entrar
            </a>

        </div>

    </div>

</header>

<main>

<section class="page-banner">

    <div class="container">

        <h1>Criar Conta</h1>

        <p>Preencha seus dados para utilizar a plataforma.</p>

    </div>

</section>

<section class="container">

<form class="form-cadastro">

<div class="form-group">

<label>Nome Completo</label>

<input type="text" placeholder="Digite seu nome">

</div>

<div class="form-group">

<label>CPF</label>

<input type="text" placeholder="000.000.000-00">

</div>

<div class="form-group">

<label>Telefone</label>

<input type="text" placeholder="(00) 00000-0000">

</div>

<div class="form-group">

<label>E-mail</label>

<input type="email" placeholder="email@exemplo.com">

</div>

<div class="form-group">

<label>Senha</label>

<input type="password" placeholder="********">

</div>

<div class="form-group">

<label>Confirmar Senha</label>

<input type="password" placeholder="********">

</div>

<button class="btn" type="button">

Criar Conta

</button>

</form>

</section>

</main>

<footer>

<div class="container">

<p>

© <span id="ano"></span> VaidTáxi - Todos os direitos reservados.

</p>

</div>
