<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro | VaidTáxi</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/animations.css">

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>

</head>

<body>

<header>

    <div class="container">

        <a href="index.html" class="logo">

            <img src="logo-vdb.png" alt="Logo">

            <h1>Vaid<span>Táxi</span></h1>

        </a>

        <nav>

            <a href="index.html">Início</a>
            <a href="motoristas.html">Motoristas</a>
            <a href="corrida.html">Corridas</a>
            <a href="pagamentos.html">Pagamentos</a>
            <a href="contato.html">Contato</a>

        </nav>

        <div class="header-buttons">

            <a href="login.html" class="btn-outline">
                Entrar
            </a>

        </div>

    </div>

</header>

<main>

<section class="page-banner">

    <div class="container">

        <h1>Criar Conta</h1>

        <p>Preencha seus dados para utilizar a plataforma.</p>

    </div>

</section>

<section class="container">

<form class="form-cadastro" id="formCadastro">

    <div class="form-group">

        <label for="nome">Nome Completo</label>

        <input
            type="text"
            id="nome"
            name="nome"
            placeholder="Digite seu nome"
            required
        >

    </div>


    <div class="form-group">

        <label for="cpf">CPF</label>

        <input
            type="text"
            id="cpf"
            name="cpf"
            placeholder="000.000.000-00"
            maxlength="14"
            required
        >

    </div>


    <div class="form-group">

        <label for="telefone">Telefone</label>

        <input
            type="text"
            id="telefone"
            name="telefone"
            placeholder="(00) 00000-0000"
            maxlength="15"
            required
        >

    </div>


    <div class="form-group">

        <label for="email">E-mail</label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="email@exemplo.com"
            required
        >

    </div>


    <div class="form-group">

        <label for="senha">Senha</label>

        <input
            type="password"
            id="senha"
            name="senha"
            placeholder="Digite sua senha"
            minlength="6"
            required
        >

    </div>


    <div class="form-group">

        <label for="confirmarSenha">Confirmar Senha</label>

        <input
            type="password"
            id="confirmarSenha"
            name="confirmarSenha"
            placeholder="Digite a senha novamente"
            minlength="6"
            required
        >

    </div>


    <button class="btn" type="submit" id="btnCadastrar">

        Criar Conta

    </button>


    <p id="mensagemCadastro" style="
        margin-top: 15px;
        text-align: center;
        font-size: 14px;
    "></p>

</form>

</section>

</main>

<footer>

<div class="container">

<p>

© <span id="ano"></span> VaidTáxi - Todos os direitos reservados.

</p>

</div>

</footer>


<script src="js/menu.js"></script>
<script src="js/cadastro.js"></script>



</body>

</html>
