<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VaidTáxi | Solicitar Corrida</title>

    <!-- ==================================================
         FONTE
    ================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- ==================================================
         CSS
    ================================================== -->

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/responsive.css">

    <link rel="stylesheet" href="css/animations.css">

</head>


<body>


    <!-- ==================================================
         CABEÇALHO
    ================================================== -->

    <header class="header">

        <div class="container">

            <a href="index.html" class="logo">

                <!--
                    Primeiro tenta encontrar a logo dentro
                    da pasta img.

                    Se não encontrar, tenta na raiz do site.
                -->

                <img
                    src="img/logo-vdb.png"
                    alt="Logo VaidTáxi"
                    onerror="this.onerror=null; this.src='logo-vdb.png';"
                >

                <h1>
                    Vaid<span>Táxi</span>
                </h1>

            </a>


            <!-- ==================================================
                 BOTÃO MENU MOBILE
            ================================================== -->

            <button
                class="menu-toggle"
                id="menuToggle"
                type="button"
                aria-label="Abrir menu"
                aria-expanded="false"
            >
                ☰
            </button>


            <!-- ==================================================
                 MENU
            ================================================== -->

            <nav class="menu" id="menu">

                <a href="index.html">
                    Início
                </a>

                <a href="motoristas.html">
                    Motoristas
                </a>

                <a href="corrida.html" class="active">
                    Solicitar Corrida
                </a>

                <a href="#" id="btnSair">
                    Sair
                </a>

            </nav>

        </div>

    </header>



    <!-- ==================================================
         CONTEÚDO PRINCIPAL
    ================================================== -->

    <main class="corrida-page">

        <div class="container">

            <!-- ==================================================
                 ÁREA DA CORRIDA
            ================================================== -->

            <section class="corrida-container">


                <!-- ==================================================
                     TÍTULO
                ================================================== -->

                <div class="corrida-header">

                    <h1>
                        Solicitar <span>Corrida</span>
                    </h1>

                    <p>
                        Informe os locais de partida e destino.
                    </p>

                </div>



                <!-- ==================================================
                     CLIENTE LOGADO
                ================================================== -->

                <div class="usuario-logado">

                    <p>

                        Olá,

                        <strong id="nomeCliente">
                            Cliente
                        </strong>

                    </p>

                </div>



                <!-- ==================================================
                     FORMULÁRIO
                ================================================== -->

                <form id="formCorrida">


                    <!-- ==================================================
                         ORIGEM
                    ================================================== -->

                    <div class="form-group">

                        <label for="origem">
                            Local de partida
                        </label>

                        <input
                            type="text"
                            id="origem"
                            name="origem"
                            placeholder="Digite o local de partida"
                            autocomplete="street-address"
                            required
                        >

                    </div>



                    <!-- ==================================================
                         DESTINO
                    ================================================== -->

                    <div class="form-group">

                        <label for="destino">
                            Destino
                        </label>

                        <input
                            type="text"
                            id="destino"
                            name="destino"
                            placeholder="Digite o destino"
                            autocomplete="street-address"
                            required
                        >

                    </div>



                    <!-- ==================================================
                         OBSERVAÇÃO
                    ================================================== -->

                    <div class="form-group">

                        <label for="observacao">
                            Observação
                        </label>

                        <textarea
                            id="observacao"
                            name="observacao"
                            rows="4"
                            placeholder="Alguma informação para o motorista? (opcional)"
                        ></textarea>

                    </div>



                    <!-- ==================================================
                         BOTÃO
                    ================================================== -->

                    <button
                        type="submit"
                        class="btn btn-primary"
                        id="btnSolicitar"
                    >
                        Solicitar Corrida
                    </button>

                </form>



                <!-- ==================================================
                     MENSAGEM
                ================================================== -->

                <div
                    id="mensagemCorrida"
                    class="mensagem"
                    style="display: none;"
                ></div>


            </section>

        </div>

    </main>



    <!-- ==================================================
         JAVASCRIPT
    ================================================== -->

    <!-- MENU -->

    <script src="js/menu.js"></script>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>



    <!-- ==================================================
         CONTROLE DA PÁGINA
    ================================================== -->

    <script>

        document.addEventListener("DOMContentLoaded", async function () {

            /*
             * ==================================================
             * ELEMENTOS
             * ==================================================
             */

            const form = document.getElementById("formCorrida");

            const btnSair = document.getElementById("btnSair");

            const nomeCliente =
                document.getElementById("nomeCliente");

            const mensagem =
                document.getElementById("mensagemCorrida");

            const btnSolicitar =
                document.getElementById("btnSolicitar");


            /*
             * ==================================================
             * VERIFICAÇÃO DO SUPABASE
             * ==================================================
             */

            if (typeof supabase === "undefined") {

                console.error(
                    "Supabase não foi carregado."
                );

                alert(
                    "Erro ao conectar ao sistema. Recarregue a página."
                );

                return;
            }


            /*
             * ==================================================
             * VERIFICAR LOGIN
             * ==================================================
             */

            try {

                const {
                    data,
                    error
                } = await supabase.auth.getSession();


                if (error) {

                    console.error(
                        "Erro ao verificar sessão:",
                        error
                    );

                    window.location.href = "login.html";

                    return;
                }


                /*
                 * Usuário não está logado.
                 */

                if (!data.session) {

                    alert(
                        "Você precisa estar logado como cliente para solicitar uma corrida."
                    );

                    window.location.href = "login.html";

                    return;
                }


                /*
                 * Usuário autenticado.
                 */

                const usuario = data.session.user;


                console.log(
                    "Cliente autenticado:",
                    usuario.email
                );


                /*
                 * Mostra o e-mail enquanto
                 * não buscamos o nome da tabela clientes.
                 */

                if (nomeCliente) {

                    nomeCliente.textContent =
                        usuario.email;

                }


            } catch (erro) {

                console.error(
                    "Erro inesperado ao verificar login:",
                    erro
                );

                window.location.href = "login.html";

                return;
            }



            /*
             * ==================================================
             * BOTÃO SAIR
             * ==================================================
             */

            if (btnSair) {

                btnSair.addEventListener(
                    "click",
                    async function (event) {

                        event.preventDefault();


                        try {

                            const {
                                error
                            } = await supabase.auth.signOut();


                            if (error) {

                                console.error(
                                    "Erro ao sair:",
                                    error
                                );

                                alert(
                                    "Não foi possível sair da conta."
                                );

                                return;
                            }


                            window.location.href =
                                "login.html";


                        } catch (erro) {

                            console.error(
                                "Erro ao sair:",
                                erro
                            );

                            window.location.href =
                                "login.html";

                        }

                    }
                );

            }



            /*
             * ==================================================
             * FORMULÁRIO DE CORRIDA
             * ==================================================
             */

            if (form) {

                form.addEventListener(
                    "submit",
                    async function (event) {

                        event.preventDefault();


                        /*
                         * Verifica novamente a sessão.
                         */

                        let sessaoAtual;


                        try {

                            const {
                                data,
                                error
                            } = await supabase.auth.getSession();


                            if (
                                error ||
                                !data.session
                            ) {

                                alert(
                                    "Sua sessão expirou. Faça login novamente."
                                );

                                window.location.href =
                                    "login.html";

                                return;
                            }


                            sessaoAtual =
                                data.session;


                        } catch (erro) {

                            console.error(
                                "Erro ao verificar sessão:",
                                erro
                            );

                            alert(
                                "Não foi possível verificar sua sessão."
                            );

                            return;
                        }



                        /*
                         * ==================================================
                         * PEGAR DADOS
                         * ==================================================
                         */

                        const origem =
                            document
                                .getElementById("origem")
                                .value
                                .trim();


                        const destino =
                            document
                                .getElementById("destino")
                                .value
                                .trim();


                        const observacao =
                            document
                                .getElementById("observacao")
                                .value
                                .trim();



                        /*
                         * ==================================================
                         * VALIDAÇÃO
                         * ==================================================
                         */

                        if (!origem) {

                            alert(
                                "Digite o local de partida."
                            );

                            document
                                .getElementById("origem")
                                .focus();

                            return;
                        }


                        if (!destino) {

                            alert(
                                "Digite o destino."
                            );

                            document
                                .getElementById("destino")
                                .focus();

                            return;
                        }



                        /*
                         * ==================================================
                         * DADOS DA CORRIDA
                         * ==================================================
                         *
                         * Por enquanto não fazemos INSERT no Supabase
                         * porque ainda precisamos confirmar exatamente
                         * os nomes das colunas da tabela "corridas".
                         */

                        console.log(
                            "================================"
                        );

                        console.log(
                            "NOVA SOLICITAÇÃO DE CORRIDA"
                        );

                        console.log(
                            "Cliente:",
                            sessaoAtual.user.id
                        );

                        console.log(
                            "E-mail:",
                            sessaoAtual.user.email
                        );

                        console.log(
                            "Origem:",
                            origem
                        );

                        console.log(
                            "Destino:",
                            destino
                        );

                        console.log(
                            "Observação:",
                            observacao
                        );

                        console.log(
                            "================================"
                        );



                        /*
                         * ==================================================
                         * MENSAGEM
                         * ==================================================
                         */

                        if (mensagem) {

                            mensagem.style.display =
                                "block";

                            mensagem.textContent =
                                "Solicitação preparada com sucesso.";

                        }



                        /*
                         * ==================================================
                         * BOTÃO
                         * ==================================================
                         */

                        if (btnSolicitar) {

                            btnSolicitar.disabled =
                                true;

                            btnSolicitar.textContent =
                                "Solicitação preparada";

                        }

                    }
                );

            }

        });

    </script>


</body>

</html>
