```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VaidTáxi | Solicitar Corrida</title>

    <!-- ==================================================
         FONTE
    ================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- ==================================================
         CSS
    ================================================== -->

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/responsive.css">

    <link rel="stylesheet" href="css/animations.css">

</head>


<body>


    <!-- ==================================================
         CABEÇALHO
    ================================================== -->

    <header class="header">

        <div class="container">

          <a href="index.html" class="logo">

    <img
        src="logo-vdb.png"
        alt="Logo VaidTáxi"
    >

    <h1>
        Vaid<span>Táxi</span>
    </h1>

</a>


            <!-- BOTÃO MENU MOBILE -->

            <button
                class="menu-toggle"
                id="menuToggle"
                type="button"
                aria-label="Abrir menu"
            >
                ☰
            </button>


            <!-- MENU -->

            <nav class="menu" id="menu">

                <a href="index.html">
                    Início
                </a>

                <a href="motoristas.html">
                    Motoristas
                </a>

                <a href="corrida.html" class="active">
                    Solicitar Corrida
                </a>

                <a href="#" id="btnSair">
                    Sair
                </a>

            </nav>

        </div>

    </header>



    <!-- ==================================================
         CONTEÚDO PRINCIPAL
    ================================================== -->

    <main class="corrida-page">

        <div class="container">


            <!-- ==================================================
                 ÁREA DA CORRIDA
            ================================================== -->

            <section class="corrida-container">


                <!-- TÍTULO -->

                <div class="corrida-header">

                    <h1>
                        Solicitar <span>Corrida</span>
                    </h1>

                    <p>
                        Informe os locais de partida e destino.
                    </p>

                </div>



                <!-- ==================================================
                     CLIENTE / VISITANTE
                ================================================== -->

                <div class="usuario-logado">

                    <p>

                        Olá,

                        <strong id="nomeCliente">
                            visitante
                        </strong>

                    </p>

                </div>



                <!-- ==================================================
                     FORMULÁRIO
                ================================================== -->

                <form id="formCorrida">


                    <!-- ORIGEM -->

                    <div class="form-group">

                        <label for="origem">
                            Local de partida
                        </label>

                        <input
                            type="text"
                            id="origem"
                            name="origem"
                            placeholder="Digite o local de partida"
                            autocomplete="street-address"
                            required
                        >

                    </div>



                    <!-- DESTINO -->

                    <div class="form-group">

                        <label for="destino">
                            Destino
                        </label>

                        <input
                            type="text"
                            id="destino"
                            name="destino"
                            placeholder="Digite o destino"
                            autocomplete="street-address"
                            required
                        >

                    </div>



                    <!-- OBSERVAÇÃO -->

                    <div class="form-group">

                        <label for="observacao">
                            Observação
                        </label>

                        <textarea
                            id="observacao"
                            name="observacao"
                            rows="4"
                            placeholder="Alguma informação para o motorista? (opcional)"
                        ></textarea>

                    </div>



                    <!-- BOTÃO -->

                    <button
                        type="submit"
                        class="btn btn-primary"
                        id="btnSolicitar"
                    >
                        Solicitar Corrida
                    </button>


                </form>



                <!-- ==================================================
                     MENSAGEM
                ================================================== -->

                <div
                    id="mensagemCorrida"
                    class="mensagem"
                    style="display:none;"
                ></div>


            </section>

        </div>

    </main>



    <!-- ==================================================
         JAVASCRIPT
    ================================================== -->

    <!-- MENU -->

    <script src="js/menu.js"></script>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>



    <!-- ==================================================
         CONTROLE DA PÁGINA
    ================================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            async function () {


                /* ==================================================
                   ELEMENTOS
                ================================================== */

                const form =
                    document.getElementById(
                        "formCorrida"
                    );


                const btnSair =
                    document.getElementById(
                        "btnSair"
                    );


                const nomeCliente =
                    document.getElementById(
                        "nomeCliente"
                    );


                const mensagem =
                    document.getElementById(
                        "mensagemCorrida"
                    );


                const btnSolicitar =
                    document.getElementById(
                        "btnSolicitar"
                    );



                /* ==================================================
                   VERIFICAR SUPABASE
                ================================================== */

                if (
                    typeof supabase === "undefined"
                ) {

                    console.error(
                        "Supabase não foi carregado."
                    );

                    return;

                }



                /* ==================================================
                   VERIFICAR SE EXISTE SESSÃO
                   
                   IMPORTANTE:
                   
                   NÃO manda o visitante para o login.
                   
                   Ele pode acessar e preencher a página
                   normalmente.
                ================================================== */

                try {

                    const {
                        data,
                        error
                    } =
                        await supabase.auth.getSession();


                    if (error) {

                        console.error(
                            "Erro ao verificar sessão:",
                            error
                        );

                    }


                    if (
                        data &&
                        data.session
                    ) {

                        const usuario =
                            data.session.user;


                        console.log(
                            "Cliente autenticado:",
                            usuario.email
                        );


                        if (nomeCliente) {

                            nomeCliente.textContent =
                                usuario.email;

                        }

                    }
                    else {

                        if (nomeCliente) {

                            nomeCliente.textContent =
                                "visitante";

                        }

                    }

                }
                catch (erro) {

                    console.error(
                        "Erro inesperado:",
                        erro
                    );

                }



                /* ==================================================
                   BOTÃO SAIR
                ================================================== */

                if (btnSair) {

                    btnSair.addEventListener(
                        "click",
                        async function (event) {

                            event.preventDefault();


                            try {

                                const {
                                    data
                                } =
                                    await supabase.auth.getSession();


                                if (
                                    !data ||
                                    !data.session
                                ) {

                                    window.location.href =
                                        "login.html";

                                    return;

                                }


                                const {
                                    error
                                } =
                                    await supabase.auth.signOut();


                                if (error) {

                                    console.error(
                                        "Erro ao sair:",
                                        error
                                    );

                                    alert(
                                        "Não foi possível sair da conta."
                                    );

                                    return;

                                }


                                window.location.href =
                                    "login.html";


                            }
                            catch (erro) {

                                console.error(
                                    "Erro ao sair:",
                                    erro
                                );

                                window.location.href =
                                    "login.html";

                            }

                        }
                    );

                }



                /* ==================================================
                   FORMULÁRIO DE CORRIDA
                ================================================== */

                if (form) {

                    form.addEventListener(
                        "submit",
                        async function (event) {

                            event.preventDefault();



                            /* ==================================================
                               PEGAR OS DADOS
                            ================================================== */

                            const origem =
                                document
                                    .getElementById(
                                        "origem"
                                    )
                                    .value
                                    .trim();


                            const destino =
                                document
                                    .getElementById(
                                        "destino"
                                    )
                                    .value
                                    .trim();


                            const observacao =
                                document
                                    .getElementById(
                                        "observacao"
                                    )
                                    .value
                                    .trim();



                            /* ==================================================
                               VALIDAR ORIGEM
                            ================================================== */

                            if (
                                origem === ""
                            ) {

                                alert(
                                    "Preencha o local de partida."
                                );

                                document
                                    .getElementById(
                                        "origem"
                                    )
                                    .focus();

                                return;

                            }



                            /* ==================================================
                               VALIDAR DESTINO
                            ================================================== */

                            if (
                                destino === ""
                            ) {

                                alert(
                                    "Preencha o destino."
                                );

                                document
                                    .getElementById(
                                        "destino"
                                    )
                                    .focus();

                                return;

                            }



                            /* ==================================================
                               AGORA VERIFICAMOS O LOGIN
                               
                               ESTE É O PONTO EM QUE O LOGIN
                               SE TORNA OBRIGATÓRIO.
                            ================================================== */

                            let sessao;


                            try {

                                const {
                                    data,
                                    error
                                } =
                                    await supabase.auth.getSession();


                                if (error) {

                                    console.error(
                                        "Erro ao verificar sessão:",
                                        error
                                    );

                                    alert(
                                        "Não foi possível verificar sua sessão."
                                    );

                                    return;

                                }


                                sessao =
                                    data.session;


                            }
                            catch (erro) {

                                console.error(
                                    "Erro ao verificar sessão:",
                                    erro
                                );

                                alert(
                                    "Não foi possível verificar sua sessão."
                                );

                                return;

                            }



                            /* ==================================================
                               USUÁRIO NÃO ESTÁ LOGADO
                            ================================================== */

                            if (!sessao) {


                                /*
                                 * Guardamos os dados temporariamente
                                 * para poder recuperá-los depois do login.
                                 */

                                sessionStorage.setItem(
                                    "corridaOrigem",
                                    origem
                                );


                                sessionStorage.setItem(
                                    "corridaDestino",
                                    destino
                                );


                                sessionStorage.setItem(
                                    "corridaObservacao",
                                    observacao
                                );


                                alert(
                                    "Para solicitar uma corrida, você precisa estar logado como cliente."
                                );


                                window.location.href =
                                    "login.html";


                                return;

                            }



                            /* ==================================================
                               USUÁRIO ESTÁ LOGADO
                            ================================================== */

                            const usuario =
                                sessao.user;


                            console.log(
                                "================================"
                            );

                            console.log(
                                "NOVA SOLICITAÇÃO DE CORRIDA"
                            );

                            console.log(
                                "Cliente:",
                                usuario.id
                            );

                            console.log(
                                "E-mail:",
                                usuario.email
                            );

                            console.log(
                                "Origem:",
                                origem
                            );

                            console.log(
                                "Destino:",
                                destino
                            );

                            console.log(
                                "Observação:",
                                observacao
                            );

                            console.log(
                                "================================"
                            );



                            /* ==================================================
                               BOTÃO
                            ================================================== */

                            if (btnSolicitar) {

                                btnSolicitar.disabled =
                                    true;

                                btnSolicitar.textContent =
                                    "Processando...";

                            }



                            /* ==================================================
                               MENSAGEM
                            ================================================== */

                            if (mensagem) {

                                mensagem.style.display =
                                    "block";

                                mensagem.textContent =
                                    "Cliente autenticado. A solicitação está pronta para ser enviada.";

                            }



                            /*
                             * IMPORTANTE:
                             *
                             * Ainda não fazemos INSERT na tabela
                             * "corridas" porque precisamos usar
                             * exatamente os nomes das colunas
                             * existentes no seu Supabase.
                             */


                            if (btnSolicitar) {

                                btnSolicitar.textContent =
                                    "Solicitação preparada";

                            }

                        }
                    );

                }

            }
        );

    </script>


</body>

</html>
```
