<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        VaidTáxi | Solicitar Corrida
    </title>


    <!-- ==================================================
         FONTE
    ================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- ==================================================
         FONT AWESOME
    ================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


    <!-- ==================================================
         LEAFLET - MAPA
    ================================================== -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >


    <!-- ==================================================
         CSS
    ================================================== -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/responsive.css"
    >

    <link
        rel="stylesheet"
        href="css/animations.css"
    >


    <!-- ==================================================
         ESTILO DO MAPA
    ================================================== -->

    <style>

        /* ==================================================
           ÁREA DO MAPA
        ================================================== */

        .mapa-corrida-wrapper {

            width: 100%;

            margin: 25px 0;

        }


        /* ==================================================
           CABEÇALHO DO MAPA
        ================================================== */

        .mapa-corrida-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            margin-bottom: 12px;

        }


        .mapa-corrida-header h2 {

            margin: 0;

            font-size: 20px;

            font-weight: 600;

        }


        .mapa-corrida-header h2 i {

            color: #FFD400;

            margin-right: 8px;

        }


        /* ==================================================
           BOTÃO LOCALIZAÇÃO
        ================================================== */

        #btnLocalizacao {

            border: none;

            background: #FFD400;

            color: #111;

            padding: 10px 16px;

            border-radius: 8px;

            font-family: "Poppins", sans-serif;

            font-weight: 600;

            cursor: pointer;

            transition: 0.3s;

        }


        #btnLocalizacao:hover {

            transform: translateY(-2px);

            filter: brightness(0.95);

        }


        #btnLocalizacao i {

            margin-right: 6px;

        }


        /* ==================================================
           MAPA
        ================================================== */

        #mapaCorrida {

            width: 100%;

            height: 420px;

            border-radius: 16px;

            overflow: hidden;

            border: 1px solid rgba(255, 212, 0, 0.25);

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.20);

            z-index: 1;

        }


        /* ==================================================
           INFORMAÇÃO DO MAPA
        ================================================== */

        .mapa-info {

            margin-top: 10px;

            padding: 10px 14px;

            border-radius: 8px;

            font-size: 13px;

            color: #aaa;

            background: rgba(255, 255, 255, 0.04);

        }


        .mapa-info i {

            color: #FFD400;

            margin-right: 5px;

        }


        /* ==================================================
           CAMPOS DE LOCALIZAÇÃO
        ================================================== */

        .campo-localizacao {

            position: relative;

        }


        .campo-localizacao input {

            padding-right: 45px;

        }


        .icone-localizacao {

            position: absolute;

            right: 14px;

            bottom: 13px;

            color: #FFD400;

            font-size: 18px;

        }


        /* ==================================================
           RESPONSIVO
        ================================================== */

        @media (max-width: 768px) {

            .mapa-corrida-header {

                flex-direction: column;

                align-items: stretch;

            }


            #btnLocalizacao {

                width: 100%;

            }


            #mapaCorrida {

                height: 330px;

                border-radius: 12px;

            }

        }


        @media (max-width: 480px) {

            #mapaCorrida {

                height: 280px;

            }

        }

    </style>

</head>


<body>


    <!-- ==================================================
         CABEÇALHO
    ================================================== -->

    <header>

        <div class="container">


            <!-- LOGO -->

            <a
                href="index.html"
                class="logo"
            >

                <img
                    src="logo-vdb.png"
                    alt="VaidTáxi"
                >

                <h1>
                    Vaid<span>Táxi</span>
                </h1>

            </a>


            <!-- MENU -->

            <nav>

                <a href="index.html">
                    Início
                </a>

                <a href="motoristas.html">
                    Motoristas
                </a>

                <a
                    href="corrida.html"
                    class="active"
                >
                    Corridas
                </a>

                <a href="pagamentos.html">
                    Pagamentos
                </a>

                <a href="contato.html">
                    Contato
                </a>

            </nav>


            <!-- ==================================================
                 BOTÕES DO CABEÇALHO

                 O auth.js atualiza esta área.
            ================================================== -->

            <div class="header-buttons">

                <a
                    href="login.html"
                    class="btn-outline"
                >
                    Entrar
                </a>

                <a
                    href="cadastro.html"
                    class="btn"
                >
                    Cadastre-se
                </a>

            </div>


            <!-- MENU MOBILE -->

            <div id="menu-mobile">

                <i class="fa-solid fa-bars"></i>

            </div>


        </div>

    </header>



    <!-- ==================================================
         CONTEÚDO PRINCIPAL
    ================================================== -->

    <main class="corrida-page">

        <div class="container">


            <!-- ==================================================
                 ÁREA DA CORRIDA
            ================================================== -->

            <section class="corrida-container">


                <!-- TÍTULO -->

                <div class="corrida-header">

                    <h1>
                        Solicitar <span>Corrida</span>
                    </h1>

                    <p>
                        Informe os locais de partida e destino.
                    </p>

                </div>



                <!-- ==================================================
                     CLIENTE
                ================================================== -->

                <div class="usuario-logado">

                    <p>

                        Olá,

                        <strong id="nomeCliente">
                            Cliente
                        </strong>

                    </p>

                </div>



                <!-- ==================================================
                     MAPA
                ================================================== -->

                <div class="mapa-corrida-wrapper">


                    <div class="mapa-corrida-header">

                        <h2>

                            <i class="fa-solid fa-map-location-dot"></i>

                            Localização da corrida

                        </h2>


                        <button
                            type="button"
                            id="btnLocalizacao"
                        >

                            <i class="fa-solid fa-location-crosshairs"></i>

                            Usar minha localização

                        </button>

                    </div>


                    <!-- MAPA -->

                    <div id="mapaCorrida"></div>


                    <div class="mapa-info">

                        <i class="fa-solid fa-circle-info"></i>

                        Use o botão acima para localizar sua posição
                        automaticamente no mapa.

                    </div>

                </div>



                <!-- ==================================================
                     FORMULÁRIO
                ================================================== -->

                <form id="formCorrida">


                    <!-- ORIGEM -->

                    <div class="form-group campo-localizacao">

                        <label for="origem">

                            Local de partida

                        </label>


                        <input
                            type="text"
                            id="origem"
                            name="origem"
                            placeholder="Digite o local de partida"
                            autocomplete="street-address"
                            required
                        >


                        <i
                            class="fa-solid fa-location-dot icone-localizacao"
                        ></i>

                    </div>



                    <!-- DESTINO -->

                    <div class="form-group campo-localizacao">

                        <label for="destino">

                            Destino

                        </label>


                        <input
                            type="text"
                            id="destino"
                            name="destino"
                            placeholder="Digite o destino"
                            autocomplete="street-address"
                            required
                        >


                        <i
                            class="fa-solid fa-flag-checkered icone-localizacao"
                        ></i>

                    </div>



                    <!-- OBSERVAÇÃO -->

                    <div class="form-group">

                        <label for="observacao">

                            Observação

                        </label>


                        <textarea
                            id="observacao"
                            name="observacao"
                            rows="4"
                            placeholder="Alguma informação para o motorista? (opcional)"
                        ></textarea>

                    </div>



                    <!-- BOTÃO -->

                    <button
                        type="submit"
                        class="btn btn-primary"
                        id="btnSolicitar"
                    >

                        Solicitar Corrida

                    </button>


                </form>



                <!-- ==================================================
                     MENSAGEM
                ================================================== -->

                <div
                    id="mensagemCorrida"
                    class="mensagem"
                    style="display:none;"
                ></div>


            </section>

        </div>

    </main>



    <!-- ==================================================
         JAVASCRIPT
    ================================================== -->


    <!-- SUPABASE -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <script src="js/supabase.js"></script>


    <!-- AUTENTICAÇÃO GLOBAL -->

    <script src="js/auth.js"></script>


    <!-- MENU -->

    <script src="js/menu.js"></script>


    <!-- ==================================================
         LEAFLET
    ================================================== -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    ></script>


<!-- ==================================================
     CONTROLE DA CORRIDA
================================================== -->

   <script src="js/corrida.js"></script>

</body>

</html>
