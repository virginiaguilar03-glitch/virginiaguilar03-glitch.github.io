<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        VaidTáxi | Solicitar Corrida
    </title>


    <!-- ==================================================
         FONTE
    ================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- ==================================================
         FONT AWESOME
    ================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


    <!-- ==================================================
         LEAFLET - MAPA
    ================================================== -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >


    <!-- ==================================================
         CSS
    ================================================== -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/responsive.css"
    >

    <link
        rel="stylesheet"
        href="css/animations.css"
    >


    <!-- ==================================================
         ESTILO DO MAPA
    ================================================== -->

    <style>

        /* ==================================================
           ÁREA DO MAPA
        ================================================== */

        .mapa-corrida-wrapper {

            width: 100%;

            margin: 25px 0;

        }


        /* ==================================================
           CABEÇALHO DO MAPA
        ================================================== */

        .mapa-corrida-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            margin-bottom: 12px;

        }


        .mapa-corrida-header h2 {

            margin: 0;

            font-size: 20px;

            font-weight: 600;

        }


        .mapa-corrida-header h2 i {

            color: #FFD400;

            margin-right: 8px;

        }


        /* ==================================================
           BOTÃO LOCALIZAÇÃO
        ================================================== */

        #btnLocalizacao {

            border: none;

            background: #FFD400;

            color: #111;

            padding: 10px 16px;

            border-radius: 8px;

            font-family: "Poppins", sans-serif;

            font-weight: 600;

            cursor: pointer;

            transition: 0.3s;

        }


        #btnLocalizacao:hover {

            transform: translateY(-2px);

            filter: brightness(0.95);

        }


        #btnLocalizacao i {

            margin-right: 6px;

        }


        /* ==================================================
           MAPA
        ================================================== */

        #mapaCorrida {

            width: 100%;

            height: 420px;

            border-radius: 16px;

            overflow: hidden;

            border: 1px solid rgba(255, 212, 0, 0.25);

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.20);

            z-index: 1;

        }


        /* ==================================================
           INFORMAÇÃO DO MAPA
        ================================================== */

        .mapa-info {

            margin-top: 10px;

            padding: 10px 14px;

            border-radius: 8px;

            font-size: 13px;

            color: #aaa;

            background: rgba(255, 255, 255, 0.04);

        }


        .mapa-info i {

            color: #FFD400;

            margin-right: 5px;

        }


        /* ==================================================
           CAMPOS DE LOCALIZAÇÃO
        ================================================== */

        .campo-localizacao {

            position: relative;

        }


        .campo-localizacao input {

            padding-right: 45px;

        }


        .icone-localizacao {

            position: absolute;

            right: 14px;

            bottom: 13px;

            color: #FFD400;

            font-size: 18px;

        }


        /* ==================================================
           RESPONSIVO
        ================================================== */

        @media (max-width: 768px) {

            .mapa-corrida-header {

                flex-direction: column;

                align-items: stretch;

            }


            #btnLocalizacao {

                width: 100%;

            }


            #mapaCorrida {

                height: 330px;

                border-radius: 12px;

            }

        }


        @media (max-width: 480px) {

            #mapaCorrida {

                height: 280px;

            }

        }

    </style>

</head>


<body>


    <!-- ==================================================
         CABEÇALHO
    ================================================== -->

    <header>

        <div class="container">


            <!-- LOGO -->

            <a
                href="index.html"
                class="logo"
            >

                <img
                    src="logo-vdb.png"
                    alt="VaidTáxi"
                >

                <h1>
                    Vaid<span>Táxi</span>
                </h1>

            </a>


            <!-- MENU -->

            <nav>

                <a href="index.html">
                    Início
                </a>

                <a href="motoristas.html">
                    Motoristas
                </a>

                <a
                    href="corrida.html"
                    class="active"
                >
                    Corridas
                </a>

                <a href="pagamentos.html">
                    Pagamentos
                </a>

                <a href="contato.html">
                    Contato
                </a>

            </nav>


            <!-- ==================================================
                 BOTÕES DO CABEÇALHO

                 O auth.js atualiza esta área.
            ================================================== -->

            <div class="header-buttons">

                <a
                    href="login.html"
                    class="btn-outline"
                >
                    Entrar
                </a>

                <a
                    href="cadastro.html"
                    class="btn"
                >
                    Cadastre-se
                </a>

            </div>


            <!-- MENU MOBILE -->

            <div id="menu-mobile">

                <i class="fa-solid fa-bars"></i>

            </div>


        </div>

    </header>



    <!-- ==================================================
         CONTEÚDO PRINCIPAL
    ================================================== -->

    <main class="corrida-page">

        <div class="container">


            <!-- ==================================================
                 ÁREA DA CORRIDA
            ================================================== -->

            <section class="corrida-container">


                <!-- TÍTULO -->

                <div class="corrida-header">

                    <h1>
                        Solicitar <span>Corrida</span>
                    </h1>

                    <p>
                        Informe os locais de partida e destino.
                    </p>

                </div>



                <!-- ==================================================
                     CLIENTE
                ================================================== -->

                <div class="usuario-logado">

                    <p>

                        Olá,

                        <strong id="nomeCliente">
                            Cliente
                        </strong>

                    </p>

                </div>



                <!-- ==================================================
                     MAPA
                ================================================== -->

                <div class="mapa-corrida-wrapper">


                    <div class="mapa-corrida-header">

                        <h2>

                            <i class="fa-solid fa-map-location-dot"></i>

                            Localização da corrida

                        </h2>


                        <button
                            type="button"
                            id="btnLocalizacao"
                        >

                            <i class="fa-solid fa-location-crosshairs"></i>

                            Usar minha localização

                        </button>

                    </div>


                    <!-- MAPA -->

                    <div id="mapaCorrida"></div>


                    <div class="mapa-info">

                        <i class="fa-solid fa-circle-info"></i>

                        Use o botão acima para localizar sua posição
                        automaticamente no mapa.

                    </div>

                </div>



                <!-- ==================================================
                     FORMULÁRIO
                ================================================== -->

                <form id="formCorrida">


                    <!-- ORIGEM -->

                    <div class="form-group campo-localizacao">

                        <label for="origem">

                            Local de partida

                        </label>


                        <input
                            type="text"
                            id="origem"
                            name="origem"
                            placeholder="Digite o local de partida"
                            autocomplete="street-address"
                            required
                        >


                        <i
                            class="fa-solid fa-location-dot icone-localizacao"
                        ></i>

                    </div>



                    <!-- DESTINO -->

                    <div class="form-group campo-localizacao">

                        <label for="destino">

                            Destino

                        </label>


                        <input
                            type="text"
                            id="destino"
                            name="destino"
                            placeholder="Digite o destino"
                            autocomplete="street-address"
                            required
                        >


                        <i
                            class="fa-solid fa-flag-checkered icone-localizacao"
                        ></i>

                    </div>



                    <!-- OBSERVAÇÃO -->

                    <div class="form-group">

                        <label for="observacao">

                            Observação

                        </label>


                        <textarea
                            id="observacao"
                            name="observacao"
                            rows="4"
                            placeholder="Alguma informação para o motorista? (opcional)"
                        ></textarea>

                    </div>



                    <!-- BOTÃO -->

                    <button
                        type="submit"
                        class="btn btn-primary"
                        id="btnSolicitar"
                    >

                        Solicitar Corrida

                    </button>


                </form>



                <!-- ==================================================
                     MENSAGEM
                ================================================== -->

                <div
                    id="mensagemCorrida"
                    class="mensagem"
                    style="display:none;"
                ></div>


            </section>

        </div>

    </main>



    <!-- ==================================================
         JAVASCRIPT
    ================================================== -->


    <!-- SUPABASE -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <script src="js/supabase.js"></script>


    <!-- AUTENTICAÇÃO GLOBAL -->

    <script src="js/auth.js"></script>


    <!-- MENU -->

    <script src="js/menu.js"></script>


    <!-- ==================================================
         LEAFLET
    ================================================== -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    ></script>



    <!-- ==================================================
         CONTROLE DA CORRIDA
    ================================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            async function () {


                /* ==================================================
                   ELEMENTOS
                ================================================== */

                const form =
                    document.getElementById(
                        "formCorrida"
                    );


                const nomeCliente =
                    document.getElementById(
                        "nomeCliente"
                    );


                const mensagem =
                    document.getElementById(
                        "mensagemCorrida"
                    );


                const btnSolicitar =
                    document.getElementById(
                        "btnSolicitar"
                    );


                const btnLocalizacao =
                    document.getElementById(
                        "btnLocalizacao"
                    );



                /* ==================================================
                   MAPA
                ================================================== */

                let mapa = null;

                let marcadorUsuario = null;



                /* ==================================================
                   INICIALIZAR MAPA
                ================================================== */

                function iniciarMapa() {

                    if (
                        typeof L === "undefined"
                    ) {

                        console.error(
                            "Leaflet não foi carregado."
                        );

                        return;

                    }


                    const mapaElemento =
                        document.getElementById(
                            "mapaCorrida"
                        );


                    if (!mapaElemento) {

                        return;

                    }


                    /*
                     * Coordenadas iniciais.
                     *
                     * Usamos uma posição inicial
                     * aproximada para o mapa.
                     */

                    const latitudeInicial =
                        -16.1425;


                    const longitudeInicial =
                        -40.2931;


                    mapa =
                        L.map(
                            "mapaCorrida"
                        ).setView(
                            [
                                latitudeInicial,
                                longitudeInicial
                            ],
                            14
                        );


                    /*
                     * OpenStreetMap
                     */

                    L.tileLayer(
                        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
                        {

                            maxZoom: 19,

                            attribution:
                                '&copy; OpenStreetMap contributors'

                        }
                    ).addTo(
                        mapa
                    );


                    /*
                     * Marcador inicial.
                     */

                    marcadorUsuario =
                        L.marker(
                            [
                                latitudeInicial,
                                longitudeInicial
                            ]
                        )
                        .addTo(
                            mapa
                        )
                        .bindPopup(
                            "Localização inicial do mapa."
                        );


                    /*
                     * Ajusta o mapa depois
                     * que a página termina de carregar.
                     */

                    setTimeout(
                        function () {

                            mapa.invalidateSize();

                        },
                        300
                    );

                }



                /* ==================================================
                   USAR LOCALIZAÇÃO ATUAL
                ================================================== */

                function obterLocalizacao() {

                    if (
                        !navigator.geolocation
                    ) {

                        alert(
                            "Seu navegador não suporta localização."
                        );

                        return;

                    }


                    if (
                        !mapa
                    ) {

                        return;

                    }


                    if (btnLocalizacao) {

                        btnLocalizacao.disabled =
                            true;


                        btnLocalizacao.innerHTML =
                            '<i class="fa-solid fa-spinner fa-spin"></i> Localizando...';

                    }


                    navigator.geolocation.getCurrentPosition(

                        function (posicao) {


                            const latitude =
                                posicao.coords.latitude;


                            const longitude =
                                posicao.coords.longitude;



                            /* ======================================
                               MOVER MAPA
                            ====================================== */

                            mapa.setView(
                                [
                                    latitude,
                                    longitude
                                ],
                                16
                            );



                            /* ======================================
                               REMOVER MARCADOR ANTERIOR
                            ====================================== */

                            if (
                                marcadorUsuario
                            ) {

                                mapa.removeLayer(
                                    marcadorUsuario
                                );

                            }



                            /* ======================================
                               NOVO MARCADOR
                            ====================================== */

                            marcadorUsuario =
                                L.marker(
                                    [
                                        latitude,
                                        longitude
                                    ]
                                )
                                .addTo(
                                    mapa
                                )
                                .bindPopup(
                                    "Você está aqui."
                                )
                                .openPopup();



                            /* ======================================
                               COLOCAR COORDENADAS NO CAMPO
                            ====================================== */

                            const origem =
                                document.getElementById(
                                    "origem"
                                );


                            if (origem) {

                                origem.value =
                                    latitude.toFixed(6) +
                                    ", " +
                                    longitude.toFixed(6);

                            }



                            /* ======================================
                               BOTÃO
                            ====================================== */

                            if (btnLocalizacao) {

                                btnLocalizacao.disabled =
                                    false;


                                btnLocalizacao.innerHTML =
                                    '<i class="fa-solid fa-location-crosshairs"></i> Localização encontrada';

                            }

                        },


                        function (erro) {


                            console.error(
                                "Erro de localização:",
                                erro
                            );


                            let mensagemErro =
                                "Não foi possível obter sua localização.";


                            if (
                                erro.code ===
                                1
                            ) {

                                mensagemErro =
                                    "Permita o acesso à localização no navegador para usar esta função.";

                            }


                            else if (
                                erro.code ===
                                2
                            ) {

                                mensagemErro =
                                    "Sua localização não está disponível no momento.";

                            }


                            else if (
                                erro.code ===
                                3
                            ) {

                                mensagemErro =
                                    "A localização demorou demais para responder.";

                            }


                            alert(
                                mensagemErro
                            );


                            if (btnLocalizacao) {

                                btnLocalizacao.disabled =
                                    false;


                                btnLocalizacao.innerHTML =
                                    '<i class="fa-solid fa-location-crosshairs"></i> Usar minha localização';

                            }

                        },


                        {

                            enableHighAccuracy:
                                true,

                            timeout:
                                10000,

                            maximumAge:
                                0

                        }

                    );

                }



                /* ==================================================
                   EVENTO DO BOTÃO DE LOCALIZAÇÃO
                ================================================== */

                if (btnLocalizacao) {

                    btnLocalizacao.addEventListener(
                        "click",
                        obterLocalizacao
                    );

                }



                /* ==================================================
                   INICIAR MAPA
                ================================================== */

                iniciarMapa();



                /* ==================================================
                   VERIFICAR SUPABASE
                ================================================== */

                if (
                    typeof supabase === "undefined"
                ) {

                    console.error(
                        "Supabase não foi carregado."
                    );

                    return;

                }



                /* ==================================================
                   VERIFICAR SE EXISTE SESSÃO
                ================================================== */

                try {

                    const {
                        data,
                        error
                    } =
                        await supabase.auth.getSession();


                    if (error) {

                        console.error(
                            "Erro ao verificar sessão:",
                            error
                        );

                    }


                    if (
                        data &&
                        data.session
                    ) {

                        const usuario =
                            data.session.user;


                        console.log(
                            "Cliente autenticado:",
                            usuario.email
                        );


                        if (nomeCliente) {

                            nomeCliente.textContent =
                                usuario.email;

                        }

                    }

                }

                catch (erro) {

                    console.error(
                        "Erro inesperado:",
                        erro
                    );

                }



                /* ==================================================
                   FORMULÁRIO
                ================================================== */

                if (form) {

                    form.addEventListener(
                        "submit",
                        async function (event) {

                            event.preventDefault();



                            /* ==================================================
                               CAPTURAR DADOS
                            ================================================== */

                            const origem =
                                document
                                    .getElementById(
                                        "origem"
                                    )
                                    .value
                                    .trim();


                            const destino =
                                document
                                    .getElementById(
                                        "destino"
                                    )
                                    .value
                                    .trim();


                            const observacao =
                                document
                                    .getElementById(
                                        "observacao"
                                    )
                                    .value
                                    .trim();



                            /* ==================================================
                               VALIDAR ORIGEM
                            ================================================== */

                            if (
                                origem === ""
                            ) {

                                alert(
                                    "Preencha o local de partida."
                                );


                                document
                                    .getElementById(
                                        "origem"
                                    )
                                    .focus();


                                return;

                            }



                            /* ==================================================
                               VALIDAR DESTINO
                            ================================================== */

                            if (
                                destino === ""
                            ) {

                                alert(
                                    "Preencha o destino."
                                );


                                document
                                    .getElementById(
                                        "destino"
                                    )
                                    .focus();


                                return;

                            }



                            /* ==================================================
                               VERIFICAR LOGIN
                            ================================================== */

                            let sessao = null;


                            try {

                                const {
                                    data,
                                    error
                                } =
                                    await supabase.auth.getSession();


                                if (error) {

                                    console.error(
                                        "Erro ao verificar sessão:",
                                        error
                                    );


                                    alert(
                                        "Não foi possível verificar sua sessão."
                                    );


                                    return;

                                }


                                sessao =
                                    data.session;

                            }

                            catch (erro) {

                                console.error(
                                    "Erro ao verificar sessão:",
                                    erro
                                );


                                alert(
                                    "Não foi possível verificar sua sessão."
                                );


                                return;

                            }



                            /* ==================================================
                               NÃO ESTÁ LOGADO
                            ================================================== */

                            if (!sessao) {


                                sessionStorage.setItem(
                                    "corridaOrigem",
                                    origem
                                );


                                sessionStorage.setItem(
                                    "corridaDestino",
                                    destino
                                );


                                sessionStorage.setItem(
                                    "corridaObservacao",
                                    observacao
                                );


                                alert(
                                    "Para solicitar uma corrida, você precisa estar logado como cliente."
                                );


                                window.location.href =
                                    "login.html";


                                return;

                            }



                            /* ==================================================
                               CLIENTE LOGADO
                            ================================================== */

                            const usuario =
                                sessao.user;


                            console.log(
                                "Cliente:",
                                usuario.id
                            );


                            console.log(
                                "E-mail:",
                                usuario.email
                            );


                            console.log(
                                "Origem:",
                                origem
                            );


                            console.log(
                                "Destino:",
                                destino
                            );


                            console.log(
                                "Observação:",
                                observacao
                            );



                            /* ==================================================
                               MENSAGEM
                            ================================================== */

                            if (mensagem) {

                                mensagem.style.display =
                                    "block";


                                mensagem.textContent =
                                    "Cliente autenticado. A corrida está pronta para ser enviada ao sistema.";

                            }



                            /* ==================================================
                               BOTÃO
                            ================================================== */

                            if (btnSolicitar) {

                                btnSolicitar.disabled =
                                    true;


                                btnSolicitar.textContent =
                                    "Solicitação preparada";

                            }

                        }
                    );

                }

            }
        );

    </script>


</body>

</html>
