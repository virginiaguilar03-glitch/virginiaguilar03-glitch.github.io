<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VaidTáxi | Solicitar Corrida</title>

    <!-- FONTE -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- CSS PRINCIPAL -->
    <link rel="stylesheet" href="css/style.css">

    <!-- RESPONSIVIDADE -->
    <link rel="stylesheet" href="css/responsive.css">

    <!-- ANIMAÇÕES -->
    <link rel="stylesheet" href="css/animations.css">

</head>

<body>

    <!-- ==================================================
         MENU
    ================================================== -->

    <header class="header">

        <div class="container">

            <a href="index.html" class="logo">
                Vaid<span>Táxi</span>
            </a>

            <button class="menu-toggle" id="menuToggle">
                ☰
            </button>

            <nav class="menu" id="menu">

                <a href="index.html">Início</a>

                <a href="motoristas.html">Motoristas</a>

                <a href="corrida.html" class="active">
                    Solicitar Corrida
                </a>

                <a href="#" id="btnSair">
                    Sair
                </a>

            </nav>

        </div>

    </header>


    <!-- ==================================================
         CONTEÚDO
    ================================================== -->

    <main class="corrida-page">

        <div class="container">

            <section class="corrida-container">

                <div class="corrida-header">

                    <h1>
                        Solicitar <span>Corrida</span>
                    </h1>

                    <p>
                        Informe os dados da sua corrida para encontrar um motorista.
                    </p>

                </div>


                <!-- USUÁRIO LOGADO -->

                <div class="usuario-logado">

                    <p>
                        Olá,
                        <strong id="nomeCliente">
                            Cliente
                        </strong>
                    </p>

                </div>


                <!-- FORMULÁRIO -->

                <form id="formCorrida">

                    <!-- ORIGEM -->

                    <div class="form-group">

                        <label for="origem">
                            Local de partida
                        </label>

                        <input
                            type="text"
                            id="origem"
                            name="origem"
                            placeholder="Digite o local de partida"
                            required
                        >

                    </div>


                    <!-- DESTINO -->

                    <div class="form-group">

                        <label for="destino">
                            Destino
                        </label>

                        <input
                            type="text"
                            id="destino"
                            name="destino"
                            placeholder="Digite o destino"
                            required
                        >

                    </div>


                    <!-- OBSERVAÇÃO -->

                    <div class="form-group">

                        <label for="observacao">
                            Observação
                        </label>

                        <textarea
                            id="observacao"
                            name="observacao"
                            placeholder="Alguma informação para o motorista? (opcional)"
                            rows="4"
                        ></textarea>

                    </div>


                    <!-- BOTÃO -->

                    <button
                        type="submit"
                        class="btn btn-primary"
                        id="btnSolicitar"
                    >
                        Solicitar Corrida
                    </button>

                </form>


                <!-- MENSAGEM -->

                <div
                    id="mensagemCorrida"
                    class="mensagem"
                    style="display:none;"
                ></div>

            </section>

        </div>

    </main>


    <!-- ==================================================
         SCRIPTS
    ================================================== -->

    <script src="js/menu.js"></script>

    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>


    <!-- ==================================================
         PROTEÇÃO DA PÁGINA
    ================================================== -->

    <script>

        document.addEventListener("DOMContentLoaded", async function () {

            try {

                /*
                 * Verifica se existe uma sessão ativa
                 * no Supabase.
                 */

                const {
                    data: { session },
                    error
                } = await supabase.auth.getSession();


                if (error) {

                    console.error(
                        "Erro ao verificar sessão:",
                        error
                    );

                    window.location.href = "login.html";

                    return;

                }


                /*
                 * Se não existir sessão,
                 * o usuário não está logado.
                 */

                if (!session) {

                    alert(
                        "Você precisa estar logado como cliente para solicitar uma corrida."
                    );

                    window.location.href = "login.html";

                    return;

                }


                /*
                 * Usuário autenticado.
                 * Podemos liberar a página.
                 */

                console.log(
                    "Cliente autenticado:",
                    session.user.email
                );


                /*
                 * Mostra o e-mail do usuário
                 * enquanto ainda não buscamos
                 * o nome na tabela de clientes.
                 */

                const nomeCliente =
                    document.getElementById("nomeCliente");


                if (nomeCliente) {

                    nomeCliente.textContent =
                        session.user.email;

                }


            } catch (erro) {

                console.error(
                    "Erro inesperado:",
                    erro
                );

                window.location.href = "login.html";

            }

        });


        /*
         * BOTÃO SAIR
         */

        document.addEventListener("DOMContentLoaded", function () {

            const btnSair =
                document.getElementById("btnSair");


            if (!btnSair) {
                return;
            }


            btnSair.addEventListener(
                "click",
                async function (event) {

                    event.preventDefault();


                    try {

                        const {
                            error
                        } = await supabase.auth.signOut();


                        if (error) {

                            console.error(
                                "Erro ao sair:",
                                error
                            );

                            alert(
                                "Não foi possível sair."
                            );

                            return;

                        }


                        window.location.href =
                            "login.html";


                    } catch (erro) {

                        console.error(erro);

                        window.location.href =
                            "login.html";

                    }

                }
            );

        });


        /*
         * FORMULÁRIO
         *
         * Por enquanto apenas impede o envio.
         * Depois vamos ligar esta parte à tabela
         * de corridas do Supabase.
         */

        document.addEventListener("DOMContentLoaded", function () {

            const form =
                document.getElementById("formCorrida");


            if (!form) {
                return;
            }


            form.addEventListener(
                "submit",
                async function (event) {

                    event.preventDefault();


                    const {
                        data: { session }
                    } = await supabase.auth.getSession();


                    /*
                     * Segurança extra:
                     * mesmo que alguém tente enviar
                     * o formulário sem sessão.
                     */

                    if (!session) {

                        alert(
                            "Sua sessão expirou. Faça login novamente."
                        );

                        window.location.href =
                            "login.html";

                        return;

                    }


                    const origem =
                        document.getElementById("origem").value.trim();


                    const destino =
                        document.getElementById("destino").value.trim();


                    const observacao =
                        document.getElementById("observacao").value.trim();


                    if (!origem || !destino) {

                        alert(
                            "Preencha o local de partida e o destino."
                        );

                        return;

                    }


                    /*
                     * Ainda não envia para o banco.
                     *
                     * Primeiro vamos confirmar que a
                     * proteção e o login estão funcionando.
                     */

                    console.log({
                        cliente_id: session.user.id,
                        origem: origem,
                        destino: destino,
                        observacao: observacao
                    });


                    alert(
                        "Cliente autenticado! A próxima etapa será registrar esta corrida no Supabase."
                    );

                }
            );

        });

    </script>

</body>

</html>
```
