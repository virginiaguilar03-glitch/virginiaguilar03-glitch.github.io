    <!-- Font Awesome -->

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/animations.css">

</head>

<body>

<header>

    <div class="container">

        <a href="index.html" class="logo">

            <img src="logo-vdb.png" alt="Logo">

            <h1>Vaid<span>Táxi</span></h1>

        </a>

        <nav>

            <a href="index.html">Início</a>
            <a href="motoristas.html">Motoristas</a>
            <a href="corrida.html" class="active">Corridas</a>
            <a href="pagamentos.html">Pagamentos</a>
            <a href="contato.html">Contato</a>

        </nav>

        <div class="header-buttons">

            <a href="login.html" class="btn-outline">Entrar</a>

            <a href="cadastro.html" class="btn">Cadastre-se</a>

        </div>

    </div>

</header>

<main>

<section class="page-banner">

    <div class="container">

        <h1>Solicitar Corrida</h1>

        <p>Preencha as informações abaixo para solicitar um motorista.</p>

    </div>

</section>

<section class="container">

<form class="form-corrida">

<div class="form-group">

<label>Local de Embarque</label>

<input type="text" placeholder="Digite o endereço de embarque">

</div>

<div class="form-group">

<label>Destino</label>

<input type="text" placeholder="Digite o destino">

</div>

<div class="form-group">

<label>Categoria</label>

<select>

<option>Selecione</option>

<option>Táxi Urbano</option>

<option>Viagem Intermunicipal</option>

<option>Frete</option>

</select>

</div>

<div class="form-group">

<label>Forma de Pagamento</label>

<select>

<option>Selecione</option>

<option>PIX</option>

<option>Cartão</option>

<option>Dinheiro</option>

</select>

</div>

<button class="btn-solicitar" onclick="solicitarCorrida()">
    Solicitar Corrida
</button>

</form>

</section>

</main>

<footer>

<div class="container">

<p>

© <span id="ano"></span> VaidTáxi - Todos os direitos reservados.

</p>

</div>
