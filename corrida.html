```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>VaidTáxi | Solicitar Corrida</title>


    <!-- ==================================================
         FONTE
    ================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- ==================================================
         CSS
    ================================================== -->

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/responsive.css">

    <link rel="stylesheet" href="css/animations.css">

</head>


<body>


    <!-- ==================================================
         CABEÇALHO PADRÃO VAIDTÁXI
    ================================================== -->

    <header>

        <div class="container">

            <a href="index.html" class="logo">

                <img
                    src="logo-vdb.png"
                    alt="Logo"
                >

                <h1>
                    Vaid<span>Táxi</span>
                </h1>

            </a>


            <nav>

                <a href="index.html">
                    Início
                </a>

                <a href="motoristas.html">
                    Motoristas
                </a>

                <a
                    href="corrida.html"
                    class="active"
                >
                    Corridas
                </a>

                <a href="pagamentos.html">
                    Pagamentos
                </a>

                <a href="contato.html">
                    Contato
                </a>

            </nav>


            <div class="header-buttons">

                <a
                    href="login.html"
                    class="btn-outline"
                >
                    Entrar
                </a>

                <a
                    href="cadastro.html"
                    class="btn"
                >
                    Cadastre-se
                </a>

            </div>

        </div>

    </header>



    <!-- ==================================================
         CONTEÚDO PRINCIPAL
    ================================================== -->

    <main class="corrida-page">

        <div class="container">


            <!-- ==================================================
                 ÁREA DA CORRIDA
            ================================================== -->

            <section class="corrida-container">


                <!-- ==================================================
                     TÍTULO
                ================================================== -->

                <div class="corrida-header">

                    <h1>
                        Solicitar <span>Corrida</span>
                    </h1>

                    <p>
                        Informe os locais de partida e destino.
                    </p>

                </div>



                <!-- ==================================================
                     USUÁRIO
                ================================================== -->

                <div class="usuario-logado">

                    <p>

                        Olá,

                        <strong id="nomeCliente">
                            visitante
                        </strong>

                    </p>

                </div>



                <!-- ==================================================
                     FORMULÁRIO
                ================================================== -->

                <form id="formCorrida">


                    <!-- ==================================================
                         ORIGEM
                    ================================================== -->

                    <div class="form-group">

                        <label for="origem">
                            Local de partida
                        </label>

                        <input
                            type="text"
                            id="origem"
                            name="origem"
                            placeholder="Digite o local de partida"
                            autocomplete="street-address"
                            required
                        >

                    </div>



                    <!-- ==================================================
                         DESTINO
                    ================================================== -->

                    <div class="form-group">

                        <label for="destino">
                            Destino
                        </label>

                        <input
                            type="text"
                            id="destino"
                            name="destino"
                            placeholder="Digite o destino"
                            autocomplete="street-address"
                            required
                        >

                    </div>



                    <!-- ==================================================
                         OBSERVAÇÃO
                    ================================================== -->

                    <div class="form-group">

                        <label for="observacao">
                            Observação
                        </label>

                        <textarea
                            id="observacao"
                            name="observacao"
                            rows="4"
                            placeholder="Alguma informação para o motorista? (opcional)"
                        ></textarea>

                    </div>



                    <!-- ==================================================
                         BOTÃO SOLICITAR
                    ================================================== -->

                    <button
                        type="submit"
                        class="btn btn-primary"
                        id="btnSolicitar"
                    >
                        Solicitar Corrida
                    </button>


                </form>



                <!-- ==================================================
                     MENSAGEM
                ================================================== -->

                <div
                    id="mensagemCorrida"
                    class="mensagem"
                    style="display: none;"
                ></div>


            </section>

        </div>

    </main>



    <!-- ==================================================
         JAVASCRIPT
    ================================================== -->

    <!-- ==================================================
         SUPABASE
    ================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>



    <!-- ==================================================
         CONTROLE DA CORRIDA
    ================================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            async function () {


                /* ==================================================
                   ELEMENTOS
                ================================================== */

                const form =
                    document.getElementById(
                        "formCorrida"
                    );


                const btnSolicitar =
                    document.getElementById(
                        "btnSolicitar"
                    );


                const nomeCliente =
                    document.getElementById(
                        "nomeCliente"
                    );


                const mensagem =
                    document.getElementById(
                        "mensagemCorrida"
                    );



                /* ==================================================
                   VERIFICAR SUPABASE
                ================================================== */

                if (
                    typeof supabase === "undefined"
                ) {

                    console.error(
                        "Supabase não foi carregado."
                    );

                    return;

                }



                /* ==================================================
                   VERIFICAR USUÁRIO LOGADO
                   
                   IMPORTANTE:
                   
                   NÃO REDIRECIONAR.
                   
                   A página continua acessível para visitantes.
                ================================================== */

                try {

                    const {
                        data,
                        error
                    } =
                        await supabase.auth.getSession();


                    if (error) {

                        console.error(
                            "Erro ao verificar sessão:",
                            error
                        );

                    }


                    if (
                        data &&
                        data.session
                    ) {

                        const usuario =
                            data.session.user;


                        console.log(
                            "Cliente autenticado:",
                            usuario.email
                        );


                        if (nomeCliente) {

                            nomeCliente.textContent =
                                usuario.email;

                        }

                    }
                    else {

                        if (nomeCliente) {

                            nomeCliente.textContent =
                                "visitante";

                        }

                    }

                }
                catch (erro) {

                    console.error(
                        "Erro ao verificar sessão:",
                        erro
                    );

                }



                /* ==================================================
                   FORMULÁRIO
                ================================================== */

                if (form) {

                    form.addEventListener(
                        "submit",
                        async function (event) {

                            event.preventDefault();



                            /* ==================================================
                               CAPTURAR DADOS
                            ================================================== */

                            const origem =
                                document
                                    .getElementById(
                                        "origem"
                                    )
                                    .value
                                    .trim();


                            const destino =
                                document
                                    .getElementById(
                                        "destino"
                                    )
                                    .value
                                    .trim();


                            const observacao =
                                document
                                    .getElementById(
                                        "observacao"
                                    )
                                    .value
                                    .trim();



                            /* ==================================================
                               VALIDAR ORIGEM
                            ================================================== */

                            if (
                                origem === ""
                            ) {

                                alert(
                                    "Preencha o local de partida."
                                );

                                document
                                    .getElementById(
                                        "origem"
                                    )
                                    .focus();

                                return;

                            }



                            /* ==================================================
                               VALIDAR DESTINO
                            ================================================== */

                            if (
                                destino === ""
                            ) {

                                alert(
                                    "Preencha o destino."
                                );

                                document
                                    .getElementById(
                                        "destino"
                                    )
                                    .focus();

                                return;

                            }



                            /* ==================================================
                               VERIFICAR LOGIN
                               
                               SOMENTE NESTE MOMENTO O LOGIN
                               É OBRIGATÓRIO.
                            ================================================== */

                            let sessao = null;


                            try {

                                const {
                                    data,
                                    error
                                } =
                                    await supabase.auth.getSession();


                                if (error) {

                                    console.error(
                                        "Erro ao verificar sessão:",
                                        error
                                    );

                                    alert(
                                        "Não foi possível verificar sua sessão."
                                    );

                                    return;

                                }


                                sessao =
                                    data.session;

                            }
                            catch (erro) {

                                console.error(
                                    "Erro ao verificar sessão:",
                                    erro
                                );

                                alert(
                                    "Não foi possível verificar sua sessão."
                                );

                                return;

                            }



                            /* ==================================================
                               NÃO ESTÁ LOGADO
                            ================================================== */

                            if (!sessao) {


                                /*
                                 * Guardar os dados temporariamente.
                                 */

                                sessionStorage.setItem(
                                    "corridaOrigem",
                                    origem
                                );


                                sessionStorage.setItem(
                                    "corridaDestino",
                                    destino
                                );


                                sessionStorage.setItem(
                                    "corridaObservacao",
                                    observacao
                                );


                                alert(
                                    "Para solicitar uma corrida, você precisa estar logado como cliente."
                                );


                                window.location.href =
                                    "login.html";


                                return;

                            }



                            /* ==================================================
                               CLIENTE LOGADO
                            ================================================== */

                            const usuario =
                                sessao.user;


                            console.log(
                                "================================"
                            );

                            console.log(
                                "SOLICITAÇÃO DE CORRIDA"
                            );

                            console.log(
                                "Cliente:",
                                usuario.id
                            );

                            console.log(
                                "E-mail:",
                                usuario.email
                            );

                            console.log(
                                "Origem:",
                                origem
                            );

                            console.log(
                                "Destino:",
                                destino
                            );

                            console.log(
                                "Observação:",
                                observacao
                            );

                            console.log(
                                "================================"
                            );



                            /* ==================================================
                               BOTÃO
                            ================================================== */

                            if (btnSolicitar) {

                                btnSolicitar.disabled =
                                    true;

                                btnSolicitar.textContent =
                                    "Processando...";

                            }



                            /* ==================================================
                               MENSAGEM
                            ================================================== */

                            if (mensagem) {

                                mensagem.style.display =
                                    "block";

                                mensagem.textContent =
                                    "Cliente autenticado. A solicitação está pronta para ser enviada.";

                            }


                            /*
                             * O INSERT no Supabase será feito
                             * na próxima etapa, depois de
                             * confirmarmos a estrutura da tabela
                             * "corridas".
                             */

                            if (btnSolicitar) {

                                btnSolicitar.textContent =
                                    "Solicitação preparada";

                            }

                        }
                    );

                }

            }
        );

    </script>


</body>

</html>
```
