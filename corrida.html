<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VaidTáxi | Solicitar Corrida</title>


    <!-- ==================================================
         FONTE
    ================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- ==================================================
         CSS
    ================================================== -->

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/responsive.css">

    <link rel="stylesheet" href="css/animations.css">

</head>


<body>


    <!-- ==================================================
         CABEÇALHO
    ================================================== -->

    <header class="header">

        <div class="container">


            <!-- ==================================================
                 LOGO
            ================================================== -->

            <a href="index.html" class="logo">

                <img
                    src="logo-vdb.png"
                    alt="Logo VaidTáxi"
                    onerror="this.onerror=null; this.src='img/logo-vdb.png';"
                >

                <h1>
                    Vaid<span>Táxi</span>
                </h1>

            </a>



            <!-- ==================================================
                 BOTÃO MENU MOBILE
            ================================================== -->

            <button
                class="menu-toggle"
                id="menuToggle"
                type="button"
                aria-label="Abrir menu"
                aria-expanded="false"
            >
                ☰
            </button>



            <!-- ==================================================
                 MENU
            ================================================== -->

            <nav class="menu" id="menu">

                <a href="index.html">
                    Início
                </a>

                <a href="motoristas.html">
                    Motoristas
                </a>

                <a href="corrida.html" class="active">
                    Solicitar Corrida
                </a>

                <a href="#" id="btnSair">
                    Sair
                </a>

            </nav>

        </div>

    </header>



    <!-- ==================================================
         CONTEÚDO PRINCIPAL
    ================================================== -->

    <main class="corrida-page">

        <div class="container">


            <!-- ==================================================
                 ÁREA DA CORRIDA
            ================================================== -->

            <section class="corrida-container">


                <!-- ==================================================
                     TÍTULO
                ================================================== -->

                <div class="corrida-header">

                    <h1>
                        Solicitar <span>Corrida</span>
                    </h1>

                    <p>
                        Informe os locais de partida e destino.
                    </p>

                </div>



                <!-- ==================================================
                     CLIENTE LOGADO
                ================================================== -->

                <div
                    class="usuario-logado"
                    id="usuarioLogado"
                >

                    <p>

                        Olá,

                        <strong id="nomeCliente">
                            visitante
                        </strong>

                    </p>

                </div>



                <!-- ==================================================
                     FORMULÁRIO
                ================================================== -->

                <form id="formCorrida">


                    <!-- ==================================================
                         ORIGEM
                    ================================================== -->

                    <div class="form-group">

                        <label for="origem">
                            Local de partida
                        </label>

                        <input
                            type="text"
                            id="origem"
                            name="origem"
                            placeholder="Digite o local de partida"
                            autocomplete="street-address"
                            required
                        >

                    </div>



                    <!-- ==================================================
                         DESTINO
                    ================================================== -->

                    <div class="form-group">

                        <label for="destino">
                            Destino
                        </label>

                        <input
                            type="text"
                            id="destino"
                            name="destino"
                            placeholder="Digite o destino"
                            autocomplete="street-address"
                            required
                        >

                    </div>



                    <!-- ==================================================
                         OBSERVAÇÃO
                    ================================================== -->

                    <div class="form-group">

                        <label for="observacao">
                            Observação
                        </label>

                        <textarea
                            id="observacao"
                            name="observacao"
                            rows="4"
                            placeholder="Alguma informação para o motorista? (opcional)"
                        ></textarea>

                    </div>



                    <!-- ==================================================
                         BOTÃO SOLICITAR
                    ================================================== -->

                    <button
                        type="submit"
                        class="btn btn-primary"
                        id="btnSolicitar"
                    >
                        Solicitar Corrida
                    </button>


                </form>



                <!-- ==================================================
                     MENSAGEM
                ================================================== -->

                <div
                    id="mensagemCorrida"
                    class="mensagem"
                    style="display: none;"
                ></div>


            </section>

        </div>

    </main>



    <!-- ==================================================
         JAVASCRIPT
    ================================================== -->

    <!-- MENU -->

    <script src="js/menu.js"></script>


    <!-- ==================================================
         SUPABASE
    ================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>



    <!-- ==================================================
         CONTROLE DA PÁGINA
    ================================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            async function () {


                /* ==================================================
                   ELEMENTOS
                ================================================== */

                const form =
                    document.getElementById(
                        "formCorrida"
                    );


                const btnSolicitar =
                    document.getElementById(
                        "btnSolicitar"
                    );


                const btnSair =
                    document.getElementById(
                        "btnSair"
                    );


                const nomeCliente =
                    document.getElementById(
                        "nomeCliente"
                    );


                const mensagem =
                    document.getElementById(
                        "mensagemCorrida"
                    );


                const usuarioLogado =
                    document.getElementById(
                        "usuarioLogado"
                    );



                /* ==================================================
                   VERIFICAR SE O SUPABASE FOI CARREGADO
                ================================================== */

                if (
                    typeof supabase === "undefined"
                ) {

                    console.error(
                        "Supabase não foi carregado."
                    );

                    return;

                }



                /* ==================================================
                   VERIFICAR SESSÃO APENAS PARA ATUALIZAR A INTERFACE
                   
                   IMPORTANTE:
                   NÃO REDIRECIONA O VISITANTE PARA O LOGIN.
                   
                   A página continua acessível normalmente.
                ================================================== */

                try {

                    const {
                        data,
                        error
                    } =
                        await supabase.auth.getSession();


                    if (error) {

                        console.error(
                            "Erro ao verificar sessão:",
                            error
                        );

                    }


                    /* ==================================================
                       USUÁRIO ESTÁ LOGADO
                    ================================================== */

                    if (
                        data &&
                        data.session
                    ) {

                        const usuario =
                            data.session.user;


                        console.log(
                            "Cliente autenticado:",
                            usuario.email
                        );


                        if (nomeCliente) {

                            nomeCliente.textContent =
                                usuario.email;

                        }


                        /*
                         * Mostra o botão Sair.
                         */

                        if (btnSair) {

                            btnSair.style.display =
                                "";

                        }

                    }


                    /* ==================================================
                       VISITANTE NÃO LOGADO
                    ================================================== */

                    else {

                        console.log(
                            "Visitante não autenticado."
                        );


                        if (nomeCliente) {

                            nomeCliente.textContent =
                                "visitante";

                        }


                        /*
                         * O visitante continua podendo
                         * preencher o formulário.
                         */

                    }


                } catch (erro) {

                    console.error(
                        "Erro ao verificar sessão:",
                        erro
                    );

                }



                /* ==================================================
                   BOTÃO SAIR
                   
                   Só funciona se houver usuário logado.
                ================================================== */

                if (btnSair) {

                    btnSair.addEventListener(
                        "click",
                        async function (event) {

                            event.preventDefault();


                            try {

                                const {
                                    data
                                } =
                                    await supabase.auth.getSession();


                                /*
                                 * Se não houver sessão,
                                 * simplesmente vai para o login.
                                 */

                                if (
                                    !data ||
                                    !data.session
                                ) {

                                    window.location.href =
                                        "login.html";

                                    return;

                                }


                                /*
                                 * Faz logout.
                                 */

                                const {
                                    error
                                } =
                                    await supabase.auth.signOut();


                                if (error) {

                                    console.error(
                                        "Erro ao sair:",
                                        error
                                    );

                                    alert(
                                        "Não foi possível sair da conta."
                                    );

                                    return;

                                }


                                window.location.href =
                                    "login.html";


                            } catch (erro) {

                                console.error(
                                    "Erro ao sair:",
                                    erro
                                );

                                window.location.href =
                                    "login.html";

                            }

                        }
                    );

                }



                /* ==================================================
                   ENVIO DO FORMULÁRIO
                ================================================== */

                if (form) {

                    form.addEventListener(
                        "submit",
                        async function (event) {

                            event.preventDefault();



                            /* ==================================================
                               PEGAR OS DADOS PRIMEIRO
                               
                               O visitante pode preencher tudo normalmente.
                            ================================================== */

                            const origem =
                                document
                                    .getElementById(
                                        "origem"
                                    )
                                    .value
                                    .trim();


                            const destino =
                                document
                                    .getElementById(
                                        "destino"
                                    )
                                    .value
                                    .trim();


                            const observacao =
                                document
                                    .getElementById(
                                        "observacao"
                                    )
                                    .value
                                    .trim();



                            /* ==================================================
                               VALIDAR CAMPOS
                            ================================================== */

                            if (!origem) {

                                alert(
                                    "Digite o local de partida."
                                );

                                document
                                    .getElementById(
                                        "origem"
                                    )
                                    .focus();

                                return;

                            }


                            if (!destino) {

                                alert(
                                    "Digite o destino."
                                );

                                document
                                    .getElementById(
                                        "destino"
                                    )
                                    .focus();

                                return;

                            }



                            /* ==================================================
                               AGORA SIM VERIFICAR LOGIN
                               
                               ESTE É O PONTO IMPORTANTE.
                               
                               O visitante só será impedido aqui,
                               quando tentar solicitar a corrida.
                            ================================================== */

                            let dataSessao;


                            try {

                                const resultado =
                                    await supabase.auth.getSession();


                                dataSessao =
                                    resultado.data;


                                if (
                                    resultado.error
                                ) {

                                    console.error(
                                        "Erro ao verificar sessão:",
                                        resultado.error
                                    );

                                }

                            } catch (erro) {

                                console.error(
                                    "Erro ao verificar sessão:",
                                    erro
                                );


                                alert(
                                    "Não foi possível verificar sua sessão. Tente novamente."
                                );

                                return;

                            }



                            /* ==================================================
                               NÃO ESTÁ LOGADO
                            ================================================== */

                            if (
                                !dataSessao ||
                                !dataSessao.session
                            ) {

                                /*
                                 * Guarda temporariamente os dados
                                 * para podermos recuperar depois
                                 * do login.
                                 */

                                sessionStorage.setItem(
                                    "corridaOrigem",
                                    origem
                                );


                                sessionStorage.setItem(
                                    "corridaDestino",
                                    destino
                                );


                                sessionStorage.setItem(
                                    "corridaObservacao",
                                    observacao
                                );


                                alert(
                                    "Para solicitar uma corrida, você precisa estar logado como cliente."
                                );


                                window.location.href =
                                    "login.html";


                                return;

                            }



                            /* ==================================================
                               USUÁRIO ESTÁ LOGADO
                            ================================================== */

                            const usuario =
                                dataSessao.session.user;


                            console.log(
                                "================================"
                            );

                            console.log(
                                "SOLICITAÇÃO DE CORRIDA"
                            );

                            console.log(
                                "Cliente:",
                                usuario.id
                            );

                            console.log(
                                "E-mail:",
                                usuario.email
                            );

                            console.log(
                                "Origem:",
                                origem
                            );

                            console.log(
                                "Destino:",
                                destino
                            );

                            console.log(
                                "Observação:",
                                observacao
                            );

                            console.log(
                                "================================"
                            );



                            /* ==================================================
                               DESABILITAR BOTÃO
                            ================================================== */

                            if (btnSolicitar) {

                                btnSolicitar.disabled =
                                    true;

                                btnSolicitar.textContent =
                                    "Processando...";

                            }



                            /* ==================================================
                               MENSAGEM TEMPORÁRIA
                               
                               O INSERT NO SUPABASE SERÁ COLOCADO
                               DEPOIS QUE CONFIRMARMOS AS COLUNAS
                               DA SUA TABELA "corridas".
                            ================================================== */

                            if (mensagem) {

                                mensagem.style.display =
                                    "block";

                                mensagem.textContent =
                                    "Cliente autenticado. Solicitação preparada para envio.";

                            }



                            /*
                             * Por enquanto o formulário não faz INSERT
                             * no banco para não inventarmos nomes de
                             * colunas que podem não existir.
                             */

                            if (btnSolicitar) {

                                btnSolicitar.textContent =
                                    "Solicitação preparada";

                            }

                        }
                    );

                }

            });

    </script>


</body>

</html>
