<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VaidTáxi | Solicitar Corrida</title>

    <!-- ==================================================
         FONTE
    ================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- ==================================================
         CSS
    ================================================== -->

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/responsive.css">

    <link rel="stylesheet" href="css/animations.css">

</head>


<body>


    <!-- ==================================================
         CABEÇALHO
    ================================================== -->

    <header class="header">

        <div class="container">

            <a href="index.html" class="logo">
                Vaid<span>Táxi</span>
            </a>


            <!-- BOTÃO MENU MOBILE -->

            <button
                class="menu-toggle"
                id="menuToggle"
                type="button"
                aria-label="Abrir menu"
            >
                ☰
            </button>


            <!-- MENU -->

            <nav class="menu" id="menu">

                <a href="index.html">
                    Início
                </a>

                <a href="motoristas.html">
                    Motoristas
                </a>

                <a href="corrida.html" class="active">
                    Solicitar Corrida
                </a>

                <a href="#" id="btnSair">
                    Sair
                </a>

            </nav>

        </div>

    </header>



    <!-- ==================================================
         CONTEÚDO PRINCIPAL
    ================================================== -->

    <main class="corrida-page">

        <div class="container">


            <!-- ==================================================
                 ÁREA DA CORRIDA
            ================================================== -->

            <section class="corrida-container">


                <!-- TÍTULO -->

                <div class="corrida-header">

                    <h1>
                        Solicitar <span>Corrida</span>
                    </h1>

                    <p>
                        Informe os locais de partida e destino.
                    </p>

                </div>



                <!-- ==================================================
                     CLIENTE LOGADO
                ================================================== -->

                <div class="usuario-logado">

                    <p>

                        Olá,

                        <strong id="nomeCliente">
                            Cliente
                        </strong>

                    </p>

                </div>



                <!-- ==================================================
                     FORMULÁRIO
                ================================================== -->

                <form id="formCorrida">


                    <!-- ORIGEM -->

                    <div class="form-group">

                        <label for="origem">
                            Local de partida
                        </label>

                        <input
                            type="text"
                            id="origem"
                            name="origem"
                            placeholder="Digite o local de partida"
                            autocomplete="street-address"
                            required
                        >

                    </div>



                    <!-- DESTINO -->

                    <div class="form-group">

                        <label for="destino">
                            Destino
                        </label>

                        <input
                            type="text"
                            id="destino"
                            name="destino"
                            placeholder="Digite o destino"
                            autocomplete="street-address"
                            required
                        >

                    </div>



                    <!-- OBSERVAÇÃO -->

                    <div class="form-group">

                        <label for="observacao">
                            Observação
                        </label>

                        <textarea
                            id="observacao"
                            name="observacao"
                            rows="4"
                            placeholder="Alguma informação para o motorista? (opcional)"
                        ></textarea>

                    </div>



                    <!-- BOTÃO -->

                    <button
                        type="submit"
                        class="btn btn-primary"
                        id="btnSolicitar"
                    >
                        Solicitar Corrida
                    </button>


                </form>



                <!-- ==================================================
                     MENSAGEM
                ================================================== -->

                <div
                    id="mensagemCorrida"
                    class="mensagem"
                    style="display:none;"
                ></div>


            </section>

        </div>

    </main>



    <!-- ==================================================
         JAVASCRIPT
    ================================================== -->

    <!-- MENU -->

    <script src="js/menu.js"></script>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>



    <!-- ==================================================
         PROTEÇÃO DA PÁGINA
    ================================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            async function () {

                try {

                    /*
                     * Verifica se existe uma sessão
                     * ativa no Supabase.
                     */

                    const {
                        data,
                        error
                    } = await supabase.auth.getSession();


                    /*
                     * Se houver erro na consulta,
                     * manda o usuário para o login.
                     */

                    if (error) {

                        console.error(
                            "Erro ao verificar sessão:",
                            error
                        );

                        window.location.href =
                            "login.html";

                        return;
                    }


                    /*
                     * Não existe sessão.
                     * Portanto, o usuário não está logado.
                     */

                    if (!data.session) {

                        alert(
                            "Você precisa estar logado como cliente para solicitar uma corrida."
                        );

                        window.location.href =
                            "login.html";

                        return;
                    }


                    /*
                     * Usuário autenticado.
                     */

                    const usuario =
                        data.session.user;


                    console.log(
                        "Cliente autenticado:",
                        usuario.email
                    );


                    /*
                     * Mostra o e-mail do cliente
                     * enquanto ainda não buscamos
                     * o nome na tabela de clientes.
                     */

                    const nomeCliente =
                        document.getElementById(
                            "nomeCliente"
                        );


                    if (nomeCliente) {

                        nomeCliente.textContent =
                            usuario.email;

                    }


                } catch (erro) {

                    console.error(
                        "Erro inesperado:",
                        erro
                    );

                    window.location.href =
                        "login.html";

                }

            }
        );



        /* ==================================================
           BOTÃO SAIR
        ================================================== */

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const btnSair =
                    document.getElementById(
                        "btnSair"
                    );


                if (!btnSair) {
                    return;
                }


                btnSair.addEventListener(
                    "click",
                    async function (event) {

                        event.preventDefault();


                        try {

                            const {
                                error
                            } = await supabase.auth.signOut();


                            if (error) {

                                console.error(
                                    "Erro ao sair:",
                                    error
                                );

                                alert(
                                    "Não foi possível sair."
                                );

                                return;
                            }


                            window.location.href =
                                "login.html";


                        } catch (erro) {

                            console.error(
                                "Erro ao sair:",
                                erro
                            );

                            window.location.href =
                                "login.html";

                        }

                    }
                );

            }
        );



        /* ==================================================
           FORMULÁRIO DE CORRIDA
        ================================================== */

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const form =
                    document.getElementById(
                        "formCorrida"
                    );


                if (!form) {
                    return;
                }


                form.addEventListener(
                    "submit",
                    async function (event) {

                        event.preventDefault();


                        /*
                         * Confirma novamente a sessão
                         * antes de permitir qualquer
                         * solicitação.
                         */

                        const {
                            data,
                            error
                        } = await supabase.auth.getSession();


                        if (
                            error ||
                            !data.session
                        ) {

                            alert(
                                "Sua sessão expirou. Faça login novamente."
                            );

                            window.location.href =
                                "login.html";

                            return;
                        }


                        const origem =
                            document
                                .getElementById(
                                    "origem"
                                )
                                .value
                                .trim();


                        const destino =
                            document
                                .getElementById(
                                    "destino"
                                )
                                .value
                                .trim();


                        const observacao =
                            document
                                .getElementById(
                                    "observacao"
                                )
                                .value
                                .trim();


                        /*
                         * Validação.
                         */

                        if (
                            origem === "" ||
                            destino === ""
                        ) {

                            alert(
                                "Preencha o local de partida e o destino."
                            );

                            return;
                        }


                        /*
                         * Neste momento não vamos
                         * inventar os nomes das colunas
                         * da sua tabela do Supabase.
                         *
                         * Os dados estão sendo capturados
                         * corretamente e a sessão está
                         * sendo validada.
                         */

                        console.log(
                            "Cliente:",
                            data.session.user.id
                        );

                        console.log(
                            "Origem:",
                            origem
                        );

                        console.log(
                            "Destino:",
                            destino
                        );

                        console.log(
                            "Observação:",
                            observacao
                        );


                        /*
                         * Mensagem temporária.
                         */

                        const mensagem =
                            document.getElementById(
                                "mensagemCorrida"
                            );


                        if (mensagem) {

                            mensagem.style.display =
                                "block";

                            mensagem.textContent =
                                "Cliente autenticado. A corrida está pronta para ser enviada ao sistema.";

                        }

                    }
                );

            }
        );

    </script>


</body>

</html>
```
